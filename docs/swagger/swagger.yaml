  /manager/projects/{id}/order:
    get:
      description: |-
        Экран проекта показывает состав, но не показывает, как он
        собирался: клиент присылал ПРИОРИТЕТ, а не список, и место
        освобождается отказом или молчанием. Менеджеру нужна вся
        очередь целиком, включая отказавшихся, — иначе непонятно,
        почему в проекте четвёртый по счёту.

        Отдельной ручкой, а не фильтром /manager/orders: тот список
        отдаёт только застрявшие заказы, а у проекта заказ давно
        оплачен и туда не попадает.
        Проект, заведённый руками, заказа не имеет — 404 здесь
        означает «его и не было», а не сбой.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_orders.Order'
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "401":
