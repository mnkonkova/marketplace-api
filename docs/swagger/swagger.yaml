      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_publications.listResp'
        "400":
          description: bad_id — неверный id проекта
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
      security:
      - BearerAuth: []
      summary: Мои выкладки в проекте (креатор)
      tags:
      - creator-publications
