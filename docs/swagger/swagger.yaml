        type: string
      portfolio:
        items:
          $ref: '#/definitions/marketpclce_internal_profiles.PortfolioItem'
        type: array
      production_name:
        description: |-
          ProductionName — название студии, в которой работает спец. Пусто, если
          спец фрилансер или ещё не выбрал. IsFreelance=true говорит «я сам по
          себе» (тогда ProductionName всегда пусто). На фронте: name → как есть;
          is_freelance → «Фриланс»; оба пусты → ничего не показываем.
        type: string
      rate_max:
        type: integer
      rate_min:
        type: integer
      rating_avg:
        type: number
      reviews:
        items:
          $ref: '#/definitions/marketpclce_internal_profiles.Review'
        type: array
      reviews_count:
        type: integer
      skills:
        items:
          $ref: '#/definitions/marketpclce_internal_profiles.SkillRef'
        type: array
      social_links:
        allOf:
        - $ref: '#/definitions/marketpclce_internal_profiles.SocialLinks'
