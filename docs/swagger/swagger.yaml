          баннер «Это превью — клиенты увидят после публикации».
        type: boolean
      is_published:
        description: |-
          IsPublished — фактический статус. Нужен фронту в preview-режиме чтобы
          различить «черновик» (false) от «на модерации» (true + not approved).
        type: boolean
