basePath: /api/v1
definitions:
  internal_admin.ActiveProjectRef:
    properties:
      id:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  internal_admin.Attention:
    properties:
      managers_unapproved:
        allOf:
        - $ref: '#/definitions/internal_admin.AttentionBlock'
        description: ManagersUnapproved — менеджеры, которым не выдали доступ.
      moderation:
        allOf:
        - $ref: '#/definitions/internal_admin.ModerationBlock'
        description: Moderation — специалисты, ждущие решения о публикации.
      projects_stale:
        allOf:
        - $ref: '#/definitions/internal_admin.AttentionBlock'
        description: ProjectsStale — идущие проекты, которые не двигались неделю.
      projects_unassigned:
        allOf:
        - $ref: '#/definitions/internal_admin.AttentionBlock'
        description: ProjectsUnassigned — проекты без ответственного менеджера.
      publications_overdue:
        allOf:
        - $ref: '#/definitions/internal_admin.AttentionBlock'
        description: PublicationsOverdue — выкладки, у которых прошла дата.
      revisions_exceeded:
        allOf:
        - $ref: '#/definitions/internal_admin.AttentionBlock'
        description: |-
          RevisionsExceeded — правок использовано больше, чем включено в
          условия: дальше либо доплата, либо разговор с клиентом.
      specialist_not_confirmed:
        allOf:
        - $ref: '#/definitions/internal_admin.AttentionBlock'
        description: |-
          SpecialistNotConfirmed — клиент выбрал специалиста в брифе, а
          менеджер не подтвердил: работа не начнётся, пока не подтвердят.
      work_without_prepayment:
        allOf:
        - $ref: '#/definitions/internal_admin.AttentionBlock'
        description: |-
          WorkWithoutPrepayment — проект в работе, а предоплата не
          подтверждена. Самый дорогой пункт списка: работу уже делают.
    type: object
  internal_admin.AttentionBlock:
    properties:
      count:
        type: integer
      items:
        description: |-
          Items — первые несколько строк, не весь набор. Никогда не null:
          пустой список фронт рисует как «чисто», отсутствующий — никак.
        items:
          $ref: '#/definitions/internal_admin.AttentionItem'
        type: array
    type: object
  internal_admin.AttentionItem:
    properties:
      id:
        description: |-
          ID — проект или пользователь, смотря по пункту. Фронт по нему
          открывает карточку.
        type: string
      note:
        description: |-
          Note — чем строка провинилась: «12 дн. без движения», «правок 5
          из 2». Пусто, если название уже всё сказало.
        type: string
      title:
        type: string
    type: object
  internal_admin.AuditResult:
    properties:
      items:
        items:
          $ref: '#/definitions/marketpclce_internal_audit.Entry'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  internal_admin.CreateClientResult:
    properties:
      invite_token:
        type: string
      invite_url:
        type: string
      user_id:
        type: string
    type: object
  internal_admin.GlobalSearchResult:
    properties:
      projects:
        items:
          $ref: '#/definitions/internal_admin.SearchProjectHit'
        type: array
      users:
        items:
          $ref: '#/definitions/internal_admin.SearchUserHit'
        type: array
    type: object
  internal_admin.InviteGenerateResult:
    properties:
      expires_at:
        type: string
      token:
        type: string
      url:
        type: string
    type: object
  internal_admin.ManagerInfo:
    properties:
      assigned_projects:
        type: integer
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      is_active:
        type: boolean
      is_approved:
        type: boolean
      last_login_at:
        description: LastLoginAt — nil = не входил ни разу.
        type: string
      user_id:
        type: string
    type: object
  internal_admin.ModerationBlock:
    properties:
      count:
        type: integer
      items:
        description: |-
          Items — первые несколько строк, не весь набор. Никогда не null:
          пустой список фронт рисует как «чисто», отсутствующий — никак.
        items:
          $ref: '#/definitions/internal_admin.AttentionItem'
        type: array
      over_day:
        type: integer
    type: object
  internal_admin.ModerationInfo:
    properties:
      is_published:
        type: boolean
      reason:
        type: string
      reviewed_at:
        type: string
      reviewed_by:
        type: string
      status:
        type: string
    type: object
  internal_admin.NavCounts:
    properties:
      checklists:
        description: |-
          Checklists/Pipelines/Productions — только действующие. Архивные
          версии шаблонов и выключенные воронки в меню не считаем: их нельзя
          подключить, и цифра у пункта означала бы объём мусора.
        type: integer
      clients:
        type: integer
      moderation_pending:
        description: |-
          ModerationPending — заявки специалистов, ждущие решения. Это число
          фронт красит отдельно: оно означает, что кого-то держат в очереди.
        type: integer
      pipelines:
        type: integer
      productions:
        type: integer
      projects_active:
        description: |-
          ProjectsActive — незавершённые и неотменённые проекты.

          Внимание: список /admin/projects по умолчанию прячет только
          отменённые, а завершённые показывает, поэтому его total бывает
          больше этого числа ровно на количество done. Здесь намеренно
          «сколько в работе» — цифра у пункта меню отвечает на этот вопрос,
          а не «сколько строк в таблице».
        type: integer
      specialists:
        description: |-
          Specialists/Clients — по users.kind, как в фильтре /admin/users.
          Пользователь с kind='both' не попадает ни в один из двух: фильтр
          списка тоже сверяет kind точным совпадением, и счётчик обязан
          сходиться со списком, который откроют по клику.
        type: integer
      team:
        description: Team — админы и менеджеры вместе, как в /admin/team.
        type: integer
    type: object
  internal_admin.PlatformHandle:
    properties:
      handle:
        description: Handle — ник или ссылка. Пусто = площадка не заполнена.
        type: string
      platform:
        type: string
    type: object
  internal_admin.SearchProjectHit:
    properties:
      client_name:
        description: ClientName — по чьему имени проект чаще всего и ищут.
        type: string
      id:
        type: string
      is_test:
        type: boolean
      kind:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  internal_admin.SearchUserHit:
    properties:
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_admin:
        type: boolean
      is_manager:
        type: boolean
      kind:
        type: string
      phone:
        type: string
    type: object
  internal_admin.Summary:
    properties:
      attention:
        $ref: '#/definitions/internal_admin.Attention'
      generated_at:
        description: |-
          GeneratedAt — момент расчёта. Сводку держат открытой часами, и без
          отметки непонятно, насколько она устарела.
        type: string
      managers:
        description: 'Managers — нагрузка команды: те же числа, что в /admin/team.'
        items:
          $ref: '#/definitions/internal_admin.TeamMember'
        type: array
      nav_counts:
        allOf:
        - $ref: '#/definitions/internal_admin.NavCounts'
        description: NavCounts — счётчики у пунктов бокового меню.
      projects_by_kind:
        additionalProperties:
          type: integer
        description: |-
          ProjectsByKind/ProjectsByStatus — распределение всех нетестовых
          проектов. Ключи присутствуют всегда, включая нулевые: иначе
          пропавший столбец диаграммы читается как сбой, а не как ноль.
        type: object
      projects_by_status:
        additionalProperties:
          type: integer
        type: object
    type: object
  internal_admin.TeamMember:
    properties:
      active_projects:
        description: ActiveProjects — незавершённые проекты, где человек ответственный.
        type: integer
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      is_active:
        type: boolean
      is_admin:
        type: boolean
      is_approved:
        type: boolean
      is_manager:
        type: boolean
      last_login_at:
        description: |-
          LastLoginAt — nil означает «не входил ни разу», а не «давно»:
          сотрудника, который так и не зашёл, надо позвать.
        type: string
      overdue_projects:
        description: OverdueProjects — из них те, где сроки уже сорваны.
        type: integer
      user_id:
        type: string
    type: object
  internal_admin.UserCard:
    properties:
      audit:
        description: |-
          Audit — записи журнала: и те, где он объект, и его собственные
          действия. Пустой список, если журнал по нему молчит.
        items:
          $ref: '#/definitions/marketpclce_internal_audit.Entry'
        type: array
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      email_verified_at:
        description: |-
          EmailVerifiedAt — когда подтверждена почта. Сам факт лежит в
          UserListItem.EmailVerified; дата нужна там, где выясняют,
          подтверждал ли человек почту сам или это сделал админ.
        type: string
      is_active:
        type: boolean
      is_admin:
        type: boolean
      is_approved:
        type: boolean
      is_manager:
        type: boolean
      is_published:
        description: |-
          IsPublished — флаг is_published у specialist_profile. Нужен фронту
          чтобы отличить «pending_review до клика "Опубликовать"» (= черновик,
          модерации не ждёт) от «pending_review после публикации» (= висит в
          очереди /admin/moderation).
        type: boolean
      is_test:
        description: |-
          IsTest — пользователь заведён для проверки. По умолчанию такие
          в выдаче скрыты.
        type: boolean
      kind:
        type: string
      last_login_at:
        description: |-
          LastLoginAt — nil означает «не входил ни разу», а не «давно».
          Разница важная: сотрудника, который так и не зашёл, надо позвать,
          а не ждать.
        type: string
      moderation:
        $ref: '#/definitions/internal_admin.ModerationInfo'
      moderation_status:
        description: |-
          ModerationStatus — pending_review|approved|rejected. NULL для клиентов
          (у них нет specialist_profile). omitempty в JSON: пустая строка =
          «нет статуса» (клиент или спец без профиля).
        type: string
      phone:
        type: string
      platforms:
        description: |-
          Platforms — пять площадок в фиксированном порядке (он же порядок
          колонок в интерфейсе). Пусто у тех, у кого нет профиля
          специалиста: площадок у них не бывает, и блок рисовать нечем.
        items:
          $ref: '#/definitions/internal_admin.PlatformHandle'
        type: array
      projects:
        description: Projects — участие во всех ролях, свежие сверху. Никогда не null.
        items:
          $ref: '#/definitions/internal_admin.UserProjectRef'
        type: array
      user_id:
        type: string
    type: object
  internal_admin.UserListItem:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      is_active:
        type: boolean
      is_admin:
        type: boolean
      is_approved:
        type: boolean
      is_manager:
        type: boolean
      is_published:
        description: |-
          IsPublished — флаг is_published у specialist_profile. Нужен фронту
          чтобы отличить «pending_review до клика "Опубликовать"» (= черновик,
          модерации не ждёт) от «pending_review после публикации» (= висит в
          очереди /admin/moderation).
        type: boolean
      is_test:
        description: |-
          IsTest — пользователь заведён для проверки. По умолчанию такие
          в выдаче скрыты.
        type: boolean
      kind:
        type: string
      last_login_at:
        description: |-
          LastLoginAt — nil означает «не входил ни разу», а не «давно».
          Разница важная: сотрудника, который так и не зашёл, надо позвать,
          а не ждать.
        type: string
      moderation_status:
        description: |-
          ModerationStatus — pending_review|approved|rejected. NULL для клиентов
          (у них нет specialist_profile). omitempty в JSON: пустая строка =
          «нет статуса» (клиент или спец без профиля).
        type: string
      phone:
        type: string
      user_id:
        type: string
    type: object
  internal_admin.UserListResult:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_admin.UserListItem'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  internal_admin.UserProjectRef:
    properties:
      id:
        type: string
      is_test:
        type: boolean
      kind:
        type: string
      role:
        description: |-
          Role — кем он в этом проекте: client | specialist | manager. Один и
          тот же человек бывает и заказчиком, и исполнителем, поэтому проект
          может попасть в список дважды с разными ролями.
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  internal_admin.UserSearchResult:
    properties:
      display_name:
        type: string
      email:
        type: string
      kind:
        type: string
      phone:
        type: string
      user_id:
        type: string
    type: object
  internal_admin.activeProjectsResp:
    properties:
      error:
        type: string
      message:
        type: string
      projects:
        items:
          $ref: '#/definitions/internal_admin.ActiveProjectRef'
        type: array
    type: object
  internal_admin.approveReq:
    properties:
      expected_updated_at:
        description: |-
          ExpectedUpdatedAt — optimistic-lock версия профиля, которую видел
          админ при открытии карточки. Если null — без проверки (для тестов
          или legacy-CLI). См. docs/SPECIALIST_MODERATION.md §5.C.
        type: string
    type: object
  internal_admin.createClientReq:
    properties:
      display_name:
        type: string
      email:
        type: string
      generate_invite:
        type: boolean
    type: object
  internal_admin.errorResponse:
    properties:
      error:
        type: string
      message:
        description: |-
          Message — человеческий текст для интерфейса. omitempty: часть ручек
          отдаёт ошибку без текста (через httpx.WriteErr).
        type: string
    type: object
  internal_admin.managersListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_admin.ManagerInfo'
        type: array
    type: object
  internal_admin.markUserTestReq:
    properties:
      is_test:
        type: boolean
    type: object
  internal_admin.moderationCountResp:
    properties:
      pending_count:
        type: integer
    type: object
  internal_admin.moderationListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/marketpclce_internal_profiles.ModerationQueueItem'
        type: array
      total:
        type: integer
    type: object
  internal_admin.promoteManagerReq:
    properties:
      send_invite:
        type: boolean
      user_id:
        type: string
    type: object
  internal_admin.redeemResp:
    properties:
      tokens:
        $ref: '#/definitions/marketpclce_internal_auth.TokenPair'
      user_id:
        type: string
    type: object
  internal_admin.rejectReq:
    properties:
      expected_updated_at:
        type: string
      reason:
        type: string
    type: object
  internal_admin.teamResp:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_admin.TeamMember'
        type: array
    type: object
  internal_admin.userSearchResp:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_admin.UserSearchResult'
        type: array
    type: object
  internal_auth.TokenPair:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  internal_auth.emailAvailableResp:
    properties:
      available:
        type: boolean
    type: object
  internal_auth.errorResponse:
    properties:
      error:
        type: string
      message:
        description: |-
          Message — человеческий текст для интерфейса. omitempty: часть ручек
          зовёт httpx.WriteErr без текста, и в ответе поля тогда нет.
        type: string
    type: object
  internal_auth.loginReq:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  internal_auth.meResp:
    properties:
      display_name:
        description: |-
          DisplayName — имя аккаунта. Заказчику показывать больше нечего:
          профиля у него нет, а раньше кабинет встречал его пустотой.
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      is_admin:
        type: boolean
      is_approved:
        description: |-
          IsApproved — для manager обязательный аппрув; фронт показывает
          «ждёт аппрува» вместо кабинета.
        type: boolean
      is_manager:
        description: |-
          IsManager / IsAdmin — флаги CRM-прав. Фронт по ним решает, какие
          кабинеты показывать в шапке. Кабинеты client/specialist выводятся
          из kind.
        type: boolean
      kind:
        type: string
      phone:
        type: string
      user_id:
        type: string
    type: object
  internal_auth.passwordResetConfirmReq:
    properties:
      password:
        type: string
      token:
        type: string
    type: object
  internal_auth.passwordResetRequestReq:
    properties:
      email:
        type: string
    type: object
  internal_auth.refreshReq:
    properties:
      refresh_token:
        type: string
    type: object
  internal_auth.registerReq:
    properties:
      display_name:
        type: string
      email:
        type: string
      kind:
        type: string
      password:
        type: string
      source:
        description: |-
          Source — откуда пришла регистрация: "landing_clients" разрешает
          авто-подтверждение email'а (юзер сразу может создать бриф без
          клика по письму). Валидность source не проверяем — это UX-ярлык,
          не security-gate: клиент всё равно должен указать реальный контакт
          в самом брифе (client_contact), туда менеджер и напишет.
        type: string
    type: object
  internal_auth.registerResp:
    properties:
      is_new:
        description: |-
          IsNew — аккаунт создан этим запросом. Фронт по нему решает, вести ли
          в мастер профиля или сразу в кабинет.
        type: boolean
      kind:
        description: |-
          Kind — настоящая роль аккаунта. Фронт ведёт по ней, а не по той, что
          сам запросил: иначе заказчик попадал в кабинет специалиста.
        type: string
      tokens:
        $ref: '#/definitions/internal_auth.TokenPair'
      user_id:
        type: string
    type: object
  internal_auth.verifyEmailReq:
    properties:
      token:
        type: string
    type: object
  internal_auth.yandexReq:
    properties:
      code:
        type: string
      kind:
        description: |-
          Kind — роль для НОВОГО пользователя. Для существующего игнорируется:
          заказчик, вошедший через Яндекс, не должен вдруг стать специалистом.
        type: string
    type: object
  internal_billing.Accrual:
    properties:
      approved_at:
        type: string
      calculated_at:
        type: string
      click_bonus:
        type: integer
      clicks:
        type: integer
      creator_name:
        type: string
      creator_user_id:
        type: string
      deduction:
        description: 'Deduction — вычет за недосданное: недосданные ролики не оплачиваются.'
        type: integer
      id:
        type: string
      is_preview:
        description: |-
          IsPreview — строка посчитана на лету и в базе её нет. Так выглядит
          месяц, который ещё не пересчитывали: цифры по фактам уже есть, и
          прятать их за кнопкой «Пересчитать» значит показывать заказчику
          ноль там, где на самом деле счёт. Утвердить и выплатить такую
          строку нельзя — сперва её сохраняет пересчёт.
        type: boolean
        x-omitempty: true
      paid_at:
        type: string
      payout_click_bonus:
        type: integer
      payout_deduction:
        type: integer
      payout_salary:
        description: |-
          Payout* — что получает сам креатор. Считается теми же правилами, но
          по его ставкам; при незаданной креаторской стороне тарифа совпадает
          со счётом. Раскладка своя, потому что объяснять «почему вышло
          столько» креатору надо его числами, а не клиентскими.
        type: integer
      payout_total:
        type: integer
      payout_views_bonus:
        type: integer
      period_start:
        description: |-
          PeriodStart — начало периода, которому принадлежит начисление.
          Периоды катятся от первой публикации проекта, а не по календарю,
          поэтому это не первое число месяца (см. billing.ProjectPeriod).
        type: string
      priority:
        description: |-
          Priority — каким по приоритету человек попал в подборку. Поля нет
          вовсе, если проект заведён руками, а не вырос из заказа: «команда
          собрана по вашему приоритету» — это про него. Отсюда omitempty:
          приоритета «ноль» не бывает, бывает его отсутствие.
        type: integer
        x-omitempty: true
      project_id:
        type: string
      salary:
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/internal_billing.AccrualStatus'
        enum:
        - draft
        - approved
        - paid
      total:
        description: Total — счёт заказчику за этого креатора.
        type: integer
      videos_delivered:
        type: integer
      videos_planned:
        description: |-
          VideosPlanned/VideosDelivered — сколько выкладок стояло и сколько
          закрыто. Разница — недостача.
        type: integer
      views_base:
        type: integer
      views_bonus:
        type: integer
      views_over:
        type: integer
      views_total:
        description: |-
          Просмотры по ступеням тарифа: ViewsBase — то, что попало под полную
          ставку (до порога на каждом ролике), ViewsOver — то, что сверх и
          считается по пониженной. Обе части, потому что по одному итогу
          потом не разобрать, почему бонус именно такой.
        type: integer
    type: object
  internal_billing.AccrualStatus:
    enum:
    - draft
    - approved
    - paid
    type: string
    x-enum-varnames:
    - AccrualDraft
    - AccrualApproved
    - AccrualPaid
  internal_billing.ClientAccrual:
    properties:
      approved_at:
        type: string
      calculated_at:
        type: string
      click_bonus:
        type: integer
      clicks:
        type: integer
      creator_name:
        type: string
      creator_user_id:
        type: string
      deduction:
        type: integer
      id:
        type: string
      paid_at:
        type: string
      period_start:
        type: string
      priority:
        description: |-
          Priority — каким по приоритету человек попал в подборку. Поля
          нет, если проект заведён руками, а не вырос из заказа.
        type: integer
        x-omitempty: true
      project_id:
        type: string
      salary:
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/internal_billing.AccrualStatus'
        description: |-
          Status/ApprovedAt/PaidAt — в каком состоянии расчёт за месяц.
          Сумм в них нет, а заказчику видно, посчитан месяц или ещё нет.
        enum:
        - draft
        - approved
        - paid
      total:
        description: Total — счёт заказчику за этого человека.
        type: integer
      videos_delivered:
        type: integer
      videos_planned:
        description: |-
          VideosPlanned/VideosDelivered — сколько выкладок стояло и сколько
          закрыто; разница объясняет вычет.
        type: integer
      views_base:
        type: integer
      views_bonus:
        type: integer
      views_over:
        type: integer
      views_total:
        type: integer
    type: object
  internal_billing.ClientBillingView:
    properties:
      accruals:
        description: Accruals — за запрошенный месяц. Пусто, пока не считали.
        items:
          $ref: '#/definitions/internal_billing.ClientAccrual'
        type: array
      payments:
        items:
          $ref: '#/definitions/internal_billing.Payment'
        type: array
      period:
        allOf:
        - $ref: '#/definitions/internal_billing.ClientPeriod'
        description: |-
          Period — какой период показан и в каком он состоянии. Заказчику
          это нужно по той же причине, что и менеджеру: пока период идёт,
          числа ещё изменятся, и счёт нельзя считать окончательным.
      terms:
        $ref: '#/definitions/internal_billing.SideTerms'
      totals:
        $ref: '#/definitions/internal_billing.ClientPeriodTotals'
    type: object
  internal_billing.ClientOverview:
    properties:
      collected_at:
        description: |-
          CollectedAt — когда последний раз собирали статистику по проектам
          этого заказчика. Подпись «данные на такое-то время» обязана быть
          правдой, поэтому nil, пока не собирали ни разу.
        type: string
      cost_per_1000:
        description: |-
          CostPer1000 — стоимость тысячи просмотров по всем проектам, в
          копейках. Считается из ФАКТИЧЕСКИХ сумм и фактических просмотров,
          а не из ставки тарифа: у разных проектов разные версии условий, и
          средняя ставка соврала бы. nil, пока просмотров нет.
        type: integer
      engagement:
        $ref: '#/definitions/internal_billing.OverviewEngagement'
      er:
        $ref: '#/definitions/internal_billing.OverviewER'
      generated_at:
        type: string
      market:
        description: |-
          Market — во сколько раз рынок дороже нас. Блока нет вовсе, пока
          нет своей цены тысячи: делить не на что.
        items:
          $ref: '#/definitions/internal_billing.OverviewMarket'
        type: array
      market_scale_version:
        description: |-
          MarketScaleVersion — версия справочника порогов, из которой взяты
          ориентиры. Чтобы через полгода на вопрос «откуда цифры» был один и
          тот же ответ.
        type: integer
      money:
        $ref: '#/definitions/internal_billing.OverviewMoney'
      platforms:
        description: Platforms — все пять площадок всегда, по убыванию просмотров.
        items:
          $ref: '#/definitions/internal_billing.OverviewPlatform'
        type: array
      projects:
        items:
          $ref: '#/definitions/internal_billing.OverviewProject'
        type: array
      projects_total:
        type: integer
      range:
        description: 'Range — какое окно посчитано: week | month | quarter.'
        enum:
        - week
        - month
        - quarter
        type: string
      range_label:
        description: |-
          RangeLabel — подпись окна человеку: «17 авг. — 15 сент. 2026».
          Считается на сервере, чтобы в браузере не завелась вторая
          реализация русских сокращений месяцев.
        type: string
      series:
        description: Series — ряд для графика, последние 90 дней.
        items:
          $ref: '#/definitions/internal_billing.OverviewPoint'
        type: array
      snapshot_approx:
        description: |-
          SnapshotApprox — хотя бы у одного подытоженного периода числа
          подтянуты: поденную статистику к моменту подытога уже удалили.
          Сводка, часть чисел которой приблизительна, обязана сказать об
          этом, а не выглядеть точной.
        type: boolean
      top_videos:
        description: TopVideos — три ролика с наибольшим приростом просмотров за окно.
        items:
          $ref: '#/definitions/internal_billing.OverviewTopVideo'
        type: array
      views:
        $ref: '#/definitions/internal_billing.OverviewViews'
      window:
        allOf:
        - $ref: '#/definitions/internal_billing.OverviewWindow'
        description: |-
          Window — числа ЗА ОКНО: главный заголовок дашборда берётся отсюда.
          Приросты живут только здесь, рядом с величинами, которые они
          описывают.
    type: object
  internal_billing.ClientPeriod:
    properties:
      carry_in_client:
        description: CarryIn/CarryOut — перенос остатка ступени, его сторона. Пока
          нули.
        type: integer
      carry_out_client:
        type: integer
      ends_on:
        type: string
      rating_scale_version:
        description: |-
          RatingScaleVersion — какой версией справочника порогов оценён
          период. Пусто, пока период идёт: пороги замораживаются подытогом.
          Номер, а не id: человеку показывают «оценено по версии 3».
        type: integer
      seq:
        description: Seq — какой это период по счёту.
        type: integer
      snapshot_approx:
        description: |-
          SnapshotApprox — числам не на что опереться: поденная статистика к
          моменту подытога уже удалена.
        type: boolean
      snapshot_as_of:
        description: SnapshotAsOf — на какую дату сняты числа подытоженного периода.
        type: string
      starts_on:
        description: |-
          StartsOn/EndsOn — границы, обе включительно. Считает сервер: иначе
          правило периода описано и в браузере тоже, и разъедется.
        type: string
      status:
        description: Status — open (идёт, числа ещё изменятся) | locked (подытожен).
        type: string
    type: object
  internal_billing.ClientPeriodTotals:
    properties:
      click_bonus:
        type: integer
      cost_per_1000:
        description: |-
          CostPer1000 — во сколько обошлась тысяча просмотров. nil, пока
          просмотров нет — делить не на что.
        type: integer
      deductions:
        type: integer
      salaries:
        type: integer
      total:
        description: Total — сколько выставлено заказчику за месяц.
        type: integer
      videos:
        type: integer
      videos_delivered:
        type: integer
      views:
        type: integer
      views_bonus:
        type: integer
    type: object
  internal_billing.CreatorAccrual:
    properties:
      approved_at:
        type: string
      calculated_at:
        description: CalculatedAt — когда посчитано.
        type: string
      click_bonus:
        type: integer
      clicks:
        type: integer
      creator_user_id:
        description: |-
          CreatorUserID — он сам. Не тайна и не лишнее: строки приходят по
          месяцам, и фронту нужно, чем их метить.
        type: string
      deduction:
        type: integer
      id:
        type: string
      paid_at:
        type: string
      period_start:
        type: string
      project_id:
        type: string
      salary:
        description: Salary/Deduction — оклад и вычет за недосданное, по его ставкам.
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/internal_billing.AccrualStatus'
        enum:
        - draft
        - approved
        - paid
      total:
        description: Total — сколько он получит за месяц.
        type: integer
      videos_delivered:
        type: integer
      videos_planned:
        description: |-
          VideosPlanned/VideosDelivered — сколько выкладок стояло и сколько
          он закрыл: из них и растёт вычет.
        type: integer
      views_base:
        type: integer
      views_bonus:
        type: integer
      views_over:
        type: integer
      views_total:
        type: integer
    type: object
  internal_billing.CreatorEarnings:
    properties:
      accruals:
        description: Accruals — мои начисления по всем периодам проекта, свежие первыми.
        items:
          $ref: '#/definitions/internal_billing.CreatorAccrual'
        type: array
      benchmark:
        allOf:
        - $ref: '#/definitions/internal_billing.ProjectBenchmark'
        description: |-
          Benchmark — обезличенный ориентир проекта: медиана просмотров
          зрелых роликов и место человека относительно неё.

          nil, пока в проекте мало зрелых роликов или они принадлежат
          одному-двум людям: тогда «медиана проекта» — это показатель
          соседа, а не агрегат. Своих данных у креатора может не хватать на
          расчёт, но чужие ему видеть нечего, и второе важнее первого.
      next_step_forecast:
        allOf:
        - $ref: '#/definitions/internal_billing.NextStepForecast'
        description: |-
          NextStep — что даст следующая ступень: сколько просмотров до неё и
          сколько денег они принесут. Прогноз, а не начисленное.

          nil, если у проекта пустой тариф (ни оклада, ни ставки) или
          периода ещё нет: ноль читался бы как «ступень ничего не даст», а
          это неправда.
      period:
        allOf:
        - $ref: '#/definitions/internal_billing.CreatorPeriod'
        description: |-
          Period — текущий период проекта. nil, пока не вышел ни один ролик:
          периоды отсчитываются от первой публикации, и до неё периода нет.
      periods:
        description: |-
          Periods — все периоды проекта, от первого к последнему.

          Здесь же, а не отдельной ручкой: строки начислений приходят по
          всем периодам сразу, и у каждой из них фронту нужны границы. Без
          списка он считал бы их сам — прибавлял месяц к period_start, — то
          есть держал бы второе описание правила периода.
        items:
          $ref: '#/definitions/internal_billing.CreatorPeriod'
        type: array
      terms:
        allOf:
        - $ref: '#/definitions/internal_billing.SideTerms'
        description: |-
          Terms — его сторона тарифа. Клиентской цены здесь нет: см.
          SideTerms в client_view.go.
      utm:
        $ref: '#/definitions/internal_billing.UTMLink'
    type: object
  internal_billing.CreatorForecast:
    properties:
      avg_views_per_video:
        description: |-
          AvgViewsPerVideo — среднее по его сданным роликам, суммарно по пяти
          площадкам. 0, если сданных роликов ещё не было.
        type: integer
      based_on_videos:
        description: |-
          BasedOnVideos — на скольких роликах основано среднее. Ноль означает
          «истории нет», и это видно в интерфейсе, а не прячется в нуле выше.
        type: integer
      creator_name:
        type: string
      creator_user_id:
        type: string
    type: object
  internal_billing.CreatorPeriod:
    properties:
      carry_in_creator:
        description: |-
          CarryIn/CarryOut — перенос остатка ступени, ЕГО сторона: сколько
          просмотров пришло из прошлого периода и сколько уходит в
          следующий. Пока нули — арифметику включат вместе с тарифом.
        type: integer
      carry_out_creator:
        type: integer
      ends_on:
        type: string
      rating_scale_version:
        description: |-
          RatingScaleVersion — какой версией справочника порогов оценён
          период. Пусто, пока период идёт.
        type: integer
      seq:
        description: 'Seq — какой это период по счёту: первый, второй, третий.'
        type: integer
      snapshot_approx:
        description: |-
          SnapshotApprox — числам не на что опереться: поденная статистика к
          моменту подытога уже удалена. Не то же самое, что «предварительно»
          у строки начисления.
        type: boolean
      snapshot_as_of:
        description: SnapshotAsOf — на какую дату сняты числа подытоженного периода.
        type: string
      starts_on:
        description: |-
          StartsOn/EndsOn — границы, обе включительно. Отдаём с сервера, а
          не оставляем фронту прибавлять месяц: правило периода живёт в
          одном месте, иначе браузер продолжит рисовать старые границы после
          первой же правки правила.
        type: string
      status:
        description: Status — open (идёт, числа ещё изменятся) | locked (подытожен).
        type: string
    type: object
  internal_billing.NextStepForecast:
    properties:
      carry_in_included:
        description: |-
          CarryInIncluded — сколько перенесённого остатка учтено. Ноль, пока
          арифметику переноса не включили вместе со ступенчатым тарифом.
        type: integer
      forecast_payout:
        description: |-
          ForecastPayout — сколько эти просмотры принесут ЕМУ по условиям
          этого проекта, копейки.

          Считается тем же кодом, что и само начисление: разница между
          выплатой сейчас и выплатой при выросших просмотрах. Отдельной
          формулы «для прогноза» нет намеренно — она разошлась бы с
          фактической выплатой, и разошлась бы молча.

          Имя начинается с forecast, а не с payout, намеренно: payout_* в
          этом коде — начисленное в строке расчёта, и прогноз под тем же
          префиксом однажды прочитали бы как заработанное. Тест приватности
          на префиксе payout_ это и поймал.
        type: integer
      step_views:
        description: StepViews — размер ступени.
        type: integer
      views_to_go:
        description: |-
          ViewsToGo — сколько просмотров осталось до неё. Считается от
          просмотров периода ПЛЮС перенесённый остаток: он уже в счёте, и не
          учесть его значило бы отправить человека добирать то, что у него
          уже есть.
        type: integer
    type: object
  internal_billing.OrderEstimate:
    properties:
      avg_views_per_video:
        description: AvgViewsPerVideo — среднее по подборке, из него и растёт прогноз.
        type: integer
      bonus_forecast:
        description: |-
          BonusForecast — бонус по ступеням тарифа. Считается НА РОЛИК, а не
          на общий объём: порог стоит на ролике, и посчитанный по сумме
          прогноз завышал бы сверхпороговую часть.
        type: integer
      creators:
        description: Creators/Videos — из самого заказа.
        type: integer
      forecast:
        description: Forecast — разбивка по людям.
        items:
          $ref: '#/definitions/internal_billing.CreatorForecast'
        type: array
      has_forecast:
        description: |-
          HasForecast — прогноз посчитан хоть по кому-то. Если false, показывать
          нужно только оклады: бонус не «ноль», а неизвестен.
        type: boolean
      salaries:
        description: Salaries — оклады, единственная точно известная часть.
        type: integer
      terms:
        allOf:
        - $ref: '#/definitions/internal_billing.SideTerms'
        description: |-
          Terms — версия правил, с которой клиент согласился при создании
          заказа. Не действующая на сегодня: цену ему называли по той.

          Сторона клиента, а не полный тариф: смета — клиентская ручка, а
          LatestTerms (смета до заказа) читает и креаторские ставки. С
          общим типом они уезжали заказчику вместе с ценой.
      total:
        description: Total — оклады плюс прогноз бонуса.
        type: integer
      videos:
        type: integer
      views_forecast:
        description: ViewsForecast — сколько просмотров ожидаем со всего заказа.
        type: integer
      without_history:
        description: |-
          WithoutHistory — по скольким из подборки истории нет. Пока их
          много, прогноз опирается на меньшинство, и это надо показать.
        type: integer
    type: object
  internal_billing.OverviewER:
    properties:
      percent:
        description: |-
          Percent — за всё время. Изменение вовлечённости — в блоке window,
          вместе с оконной вовлечённостью, которую оно и описывает.
        type: number
      without_shares:
        description: |-
          WithoutShares — хотя бы одна площадка не отдаёт репосты, и они в
          расчёт не вошли. Ноль репостов и «мы их не знаем» — разные
          утверждения; на экране это звёздочка.
        type: boolean
    type: object
  internal_billing.OverviewEngagement:
    properties:
      comments:
        type: integer
      total:
        description: |-
          Total/Comments — за всё время, как и остальные итоги сводки.
          Приростов здесь нет намеренно: прирост окна рядом с итогом за всё
          время описывал бы не то число, возле которого стоит. Оконные
          значения и их приросты — в блоке window.
        type: integer
    type: object
  internal_billing.OverviewMarket:
    properties:
      key:
        type: string
      measured_on:
        type: string
      price_per_1000:
        description: PricePer1000 — цена тысячи у ориентира, копейки.
        type: integer
      source:
        description: |-
          Source/MeasuredOn — откуда число и когда измерено. Обязательны:
          цифра рынка без источника и даты через год начнёт врать, и
          заметить это будет нечем.
        type: string
      times_cheaper:
        description: |-
          TimesCheaper — во сколько раз ориентир дороже нашей фактической
          цены тысячи. Считается на сервере из cost_per_1000: второй расчёт
          в браузере разошёлся бы с первым.
        type: number
      title:
        type: string
    type: object
  internal_billing.OverviewMoney:
    properties:
      current:
        description: 'Current — по текущим периодам: предварительная, числа ещё вырастут.'
        type: integer
      locked:
        description: 'Locked — сумма по подытоженным периодам: окончательная, из срезов.'
        type: integer
      paid:
        description: |-
          Paid — сколько заказчик уже перевёл: подтверждённые платежи.
          Отдельно от Total намеренно — это разные вопросы: «сколько стоит»
          и «сколько внесено».
        type: integer
      total:
        description: Total — Locked + Current, «сколько всего стоит работа на сегодня».
        type: integer
    type: object
  internal_billing.OverviewPlatform:
    properties:
      delta_pct:
        description: DeltaPct — прирост просмотров за окно против предыдущего окна.
        type: integer
      er_percent:
        description: ERPercent — вовлечённость площадки. nil, пока просмотров нет.
        type: number
      er_without_shares:
        type: boolean
      platform:
        type: string
      series:
        description: |-
          Series — прирост по дням внутри окна. Дни без сбора пропущены, а
          не отданы нулём: ноль нарисовал бы провал там, где просто не
          приходил сборщик.
        items:
          $ref: '#/definitions/internal_billing.OverviewPoint'
        type: array
      share_pct:
        type: integer
      views:
        description: |-
          Views — за всё время; доля считается от них же, поэтому доли пяти
          площадок дают сто процентов (с точностью до округления).
        type: integer
      window_share_pct:
        type: integer
      window_views:
        description: |-
          WindowViews/WindowSharePct — то же за окно. Полоса состава на
          дашборде рисуется по ним, чтобы сходиться с главным числом;
          оконные доли дают сто процентов от оконной суммы.
        type: integer
    type: object
  internal_billing.OverviewPoint:
    properties:
      date:
        type: string
      views_gained:
        description: |-
          ViewsGained — сколько просмотров набрали за этот день, а не всего
          на эту дату. Поденный ряд накопительный, и «всего на дату»
          пришлось бы достраивать по каждой ссылке за каждый день; прирост
          показывает ровно то, ради чего график и смотрят.
        type: integer
    type: object
  internal_billing.OverviewProject:
    properties:
      cost_per_1000:
        description: |-
          CostPer1000 — стоимость тысячи просмотров по этому проекту. nil,
          пока просмотров нет: делить не на что.
        type: integer
      period:
        allOf:
        - $ref: '#/definitions/internal_billing.ClientPeriod'
        description: Period — текущий период проекта. nil у не начавшегося.
      project_id:
        type: string
      state:
        description: State — running | not_started.
        type: string
      title:
        type: string
      total:
        description: 'Total — счёт по проекту: подытоженные периоды плюс текущий.'
        type: integer
      views:
        type: integer
    type: object
  internal_billing.OverviewTopVideo:
    properties:
      platform:
        description: |-
          Platform — площадка-лидер: та, что дала больше всех просмотров за
          окно. Ссылка — на неё же.
        type: string
      publication_id:
        type: string
      published_at:
        description: |-
          PublishedAt — когда ролик вышел, ГГГГ-ММ-ДД. Дата выхода, а не
          сдачи ссылки: см. publications.ClientFeed.
        type: string
      title:
        description: |-
          Title — название, которое дал креатор. Пустое отдаём как есть:
          подставлять «Без названия» — дело интерфейса, а не сервера.
        type: string
      url:
        type: string
      views:
        description: |-
          Views — просмотры, набранные ЗА ОКНО. Показываем ту же величину,
          по которой сортируем: иначе список едет относительно чисел.
        type: integer
    type: object
  internal_billing.OverviewViews:
    properties:
      by_platform:
        additionalProperties:
          format: int64
          type: integer
        description: |-
          ByPlatform — все пять площадок всегда, включая нулевые: пропавший
          столбик читается как сбой, а не как ноль.
        type: object
      total:
        description: |-
          Total — за всё время по всем проектам заказчика. Не за окно
          дашборда: по этому же числу считается стоимость тысячи, и
          подменить его оконным значило бы тихо поменять смысл поля.
          Оконные просмотры лежат отдельно, в блоке window.
        type: integer
    type: object
  internal_billing.OverviewWindow:
    properties:
      comments:
        type: integer
      comments_delta_pct:
        type: integer
      engagement:
        description: Engagement — лайки + комментарии + репосты, набранные за окно.
        type: integer
      engagement_delta_pct:
        type: integer
      er_delta_pp:
        description: |-
          ERDeltaPP — изменение в ПУНКТАХ против предыдущего окна: «было
          4,7 — стало 4,4» понятнее, чем «упало на 6%».
        type: number
      er_percent:
        description: |-
          ERPercent — вовлечённость окна: взаимодействия окна ÷ просмотры
          окна. Ноль, пока просмотров в окне нет.
        type: number
      er_without_shares:
        description: ERWithoutShares — в окне хотя бы одна площадка не отдала репосты.
        type: boolean
      views:
        type: integer
      views_delta_pct:
        description: |-
          ViewsDeltaPct — против предыдущего окна такой же длины. Поля нет
          вовсе, если сравнивать не с чем: ноль означал бы «не выросло».
        type: integer
    type: object
  internal_billing.Payment:
    properties:
      amount:
        description: Amount — сколько ждём, копейки.
        type: integer
      confirmed_at:
        type: string
      confirmed_by:
        type: string
      created_at:
        type: string
      id:
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/internal_billing.PaymentKind'
        enum:
        - prepayment
        - final
      note:
        type: string
      project_id:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/internal_billing.PaymentStatus'
        enum:
        - awaiting
        - confirmed
        - cancelled
    type: object
  internal_billing.PaymentKind:
    enum:
    - prepayment
    - final
    type: string
    x-enum-varnames:
    - PaymentPrepayment
    - PaymentFinal
  internal_billing.PaymentStatus:
    enum:
    - awaiting
    - confirmed
    - cancelled
    type: string
    x-enum-varnames:
    - PaymentAwaiting
    - PaymentConfirmed
    - PaymentCancelled
  internal_billing.PeriodTotals:
    properties:
      click_bonus:
        type: integer
      cost_per_1000:
        description: |-
          CostPer1000 — во сколько обошлась тысяча просмотров: (оклады +
          бонусы) ÷ просмотры. nil, пока просмотров нет — делить не на что.
        type: integer
      deductions:
        type: integer
      margin:
        type: integer
      payouts:
        type: integer
      salaries:
        type: integer
      total:
        description: |-
          Total — сколько выставлено заказчику; Payouts — сколько должны
          креаторам; Margin — разница, то есть что остаётся платформе.
          При незаданной креаторской стороне тарифа Payouts равен Total, а
          Margin нулевой: платформа ничего не удерживает.
        type: integer
      videos:
        description: |-
          Videos/VideosDelivered — сколько выкладок стояло и сколько закрыто.
          «по 6 роликам» в шапке считается отсюда.
        type: integer
      videos_delivered:
        type: integer
      views:
        type: integer
      views_bonus:
        type: integer
    type: object
  internal_billing.ProjectBenchmark:
    properties:
      mature_videos:
        description: |-
          MatureVideos — сколько зрелых роликов проекта вошло в расчёт.
          Пусто по той же причине: ниже порога это число говорит о составе
          проекта больше, чем следует.
        type: integer
      my_mature_videos:
        description: |-
          MyMatureVideos — сколько зрелых роликов у него самого. Его
          собственное число, обезличивать нечего; заодно объясняет, почему
          источник именно такой.
        type: integer
      my_percentile:
        description: |-
          MyPercentile — где человек относительно медианы проекта: доля
          зрелых роликов проекта, которые слабее его медианного. 0 — ниже
          всех, 100 — выше всех. Пусто, если сравнивать не с чем или не по
          чему.
        type: integer
      project_median_views:
        description: |-
          ProjectMedianViews — медиана просмотров зрелых роликов проекта.
          Пусто, если проект не прошёл порог обезличивания.
        type: integer
      typical_video_source:
        description: |-
          TypicalVideoSource — на чьих данных посчитано: creator | project |
          default.

          Обязателен, а не украшение: человеку говорят «до ступени двадцать
          роликов», и он вправе знать, чьи это данные. «По твоим роликам» и
          «ориентир по площадке, своих данных пока мало» — разные обещания,
          и второе не должно выдавать себя за первое.
        type: string
      typical_video_views:
        description: |-
          TypicalVideoViews — «типичный ролик»: от него считается, сколько
          роликов осталось до следующей ступени. Лесенку выбора целиком
          проходит сервер, фронту остаётся показать число и подпись.
        type: integer
    type: object
  internal_billing.ProjectBilling:
    properties:
      accruals:
        description: |-
          Accruals — за запрошенный месяц. Пусто, пока не считали.

          Заказчик их тоже видит: в макете это «Команда месяца» — кто сколько
          роликов сдал и во сколько это ему обошлось. Он за них и платит,
          поэтому строка «60 000 + 5 850» — его счёт, а не чужие данные.
        items:
          $ref: '#/definitions/internal_billing.Accrual'
        type: array
      payments:
        items:
          $ref: '#/definitions/internal_billing.Payment'
        type: array
      period:
        allOf:
        - $ref: '#/definitions/internal_billing.ProjectPeriod'
        description: |-
          Period — какой период показан и в каком он состоянии. Отсюда же
          понятно, почему строки помечены «предварительно».
      terms:
        $ref: '#/definitions/internal_billing.Terms'
      totals:
        allOf:
        - $ref: '#/definitions/internal_billing.PeriodTotals'
        description: |-
          Totals — итог периода. Считается из тех же строк, но на сервере:
          «оклады 180 000 + бонус 24 678 · 746 ₽ за 1000» показывают и
          менеджеру, и заказчику, и складывать это дважды на двух экранах
          значит получить два разных числа.
      utm:
        items:
          $ref: '#/definitions/internal_billing.UTMLink'
        type: array
    type: object
  internal_billing.ProjectPeriod:
    properties:
      carry_in_client:
        description: |-
          Carry* — перенос остатка ступени тарифа, в просмотрах.

          Ступень — 100 000 просмотров; остаток, не добравший до полной,
          едет в следующий период и складывается с его просмотрами. Стороны
          разные: клиентская и креаторская считаются по своим ставкам и
          разъедутся, одно число на двоих скрыло бы это.

          Сейчас нули: арифметику включат, когда утвердят тариф. Место под
          неё — в подытоженном периоде, потому что перенос такая же
          замороженная величина, как просмотры.
        type: integer
      carry_in_creator:
        type: integer
      carry_out_client:
        type: integer
      carry_out_creator:
        type: integer
      client_debt_in:
        description: |-
          ClientDebtIn/ClientDebtOut — долг перед клиентом в ПРОСМОТРАХ:
          недобрали гарантию — период оплачен как гарантия, а недостающее
          добираем бесплатно в следующем. Не в деньгах, так в оферте.
        type: integer
      client_debt_out:
        type: integer
      ends_on:
        type: string
      id:
        type: string
      locked_at:
        type: string
      locked_by:
        description: |-
          LockedBy — кто подытожил. nil = фоновая задача; ручного подытога
          нет вовсе, так что сейчас здесь всегда nil.
        type: string
      prev_period_id:
        description: |-
          PrevPeriodID — предыдущий период. nil только у первого: остаток
          ступени переносится по цепочке, и она должна быть явной.
        type: string
      project_id:
        type: string
      rating_scale_id:
        description: |-
          RatingScaleID — какой версией справочника порогов оценивался
          период. Проставляется при подытоге и больше не меняется: чем
          оценивали, тем и оценивали. nil у периода, который ещё идёт.
        type: string
      rating_scale_version:
        description: |-
          RatingScaleVersion — её номер: человеку показывают «оценено по
          версии 3», а не uuid.
        type: integer
      seq:
        description: 'Seq — какой это период по счёту: первый, второй, третий.'
        type: integer
      snapshot_approx:
        description: |-
          SnapshotApprox — числам не на что опереться: поденный ряд к моменту
          фиксации уже схлопнули.

          Не путать с «предварительно» (Accrual.IsPreview): то про период,
          который ещё идёт, это — про период, который подытожен, но
          опирается на пустоту. Могут стоять одновременно, и в интерфейсе их
          нельзя схлопывать в одну плашку.
        type: boolean
      snapshot_as_of:
        description: |-
          SnapshotAsOf — на какую дату сняты числа: конец периода плюс две
          недели. Это отсечка, а не момент фиксации: воркер мог опоздать, и
          числа всё равно должны быть теми, что были на отсечку.
        type: string
      starts_on:
        description: StartsOn/EndsOn — границы, обе включительно.
        type: string
      status:
        type: string
    type: object
  internal_billing.SideTerms:
    properties:
      bonus_views_threshold:
        type: integer
      click_bonus_rate:
        type: integer
        x-nullable: true
      click_bonus_rate_over:
        type: integer
        x-nullable: true
      click_bonus_threshold:
        type: integer
      project_id:
        type: string
      rate_per_1000_views:
        type: integer
      rate_per_1000_views_over:
        type: integer
      salary_per_month:
        type: integer
      terms_version_id:
        description: TermsVersionID — с какой версии прайса сняты числа.
        type: string
      updated_at:
        type: string
      videos_first_month:
        type: integer
      videos_next_months:
        type: integer
    type: object
  internal_billing.Terms:
    properties:
      base_fee:
        description: BaseFee — фикс со второго периода.
        type: integer
        x-nullable: true
      bonus_views_threshold:
        description: |-
          BonusViewsThreshold — порог НА РОЛИК, суммой по пяти площадкам.
          До него платим полную ставку, свыше — пониженную. 0 = порога нет,
          весь объём идёт по полной ставке.
        type: integer
      click_bonus_rate:
        description: |-
          ClickBonusRate — ставка за переход по UTM до месячного порога,
          копейки. nil = бонус за переходы не считается: источник кликов не
          подключён, а поля в тарифе есть.
        type: integer
        x-nullable: true
      click_bonus_rate_over:
        description: ClickBonusRateOver — ставка за каждый следующий переход.
        type: integer
        x-nullable: true
      click_bonus_threshold:
        description: |-
          ClickBonusThreshold — сколько переходов ЗА МЕСЯЦ идёт по полной
          ставке. Порог здесь месячный, а не на ролик — в отличие от просмотров.
        type: integer
      creator_base_fee:
        type: integer
        x-nullable: true
      creator_first_period_fee:
        description: |-
          Креаторская сторона тех же ступеней. nil означает «столько же,
          сколько у клиента» — то же правило, что у нынешних креаторских
          ставок.
        type: integer
        x-nullable: true
      creator_rate_per_1000_views:
        type: integer
        x-nullable: true
      creator_rate_per_1000_views_over:
        type: integer
        x-nullable: true
      creator_salary_per_month:
        description: |-
          Креаторская сторона тарифа: что получает исполнитель.

          nil означает «столько же, сколько платит клиент»: до заполнения этих
          полей выплата равна счёту и маржи у платформы нет. Две стороны нужны
          потому, что это разные деньги — счёт заказчику и обязательство перед
          креатором; одно число за оба показывало креатору в личном кабинете
          цену клиента как его собственный заработок.
        type: integer
        x-nullable: true
      creator_step_fee:
        type: integer
        x-nullable: true
      creator_step_fee_over:
        type: integer
        x-nullable: true
      first_period_fee:
        description: |-
          FirstPeriodFee — фикс за первый период проекта: там оплачивается
          запуск, а не результат, и ступени не считаются вовсе.
        type: integer
        x-nullable: true
      guarantee_views:
        description: |-
          GuaranteeViews — гарантия в просмотрах. Недобрали — период всё
          равно оплачивается как гарантия, а недостающие просмотры уходят в
          долг перед клиентом и гасятся из следующего периода. Долг в
          ПРОСМОТРАХ, а не в деньгах: так в оферте.
        type: integer
        x-nullable: true
      project_id:
        type: string
      rate_per_1000_views:
        description: RatePer1000Views — ставка за тысячу просмотров ДО порога, копейки.
        type: integer
      rate_per_1000_views_over:
        description: |-
          RatePer1000ViewsOver — ставка за тысячу просмотров СВЕРХ порога.
          Ниже основной намеренно: так виральный ролик не съедает бюджет.
        type: integer
      salary_per_month:
        description: SalaryPerMonth — оклад креатора за месяц, копейки.
        type: integer
      step_cap_views:
        description: StepCapViews — выше этого объёма ступени не оплачиваются.
        type: integer
        x-nullable: true
      step_fee:
        description: StepFee — цена полной ступени до StepTier2From.
        type: integer
        x-nullable: true
      step_fee_over:
        description: StepFeeOver — цена ступени после этого порога.
        type: integer
        x-nullable: true
      step_tier2_from:
        description: StepTier2From — с какого объёма ступень дешевеет.
        type: integer
        x-nullable: true
      step_views:
        description: |-
          StepViews — размер ступени в просмотрах. Раньше сто тысяч были
          константой в коде.
        type: integer
        x-nullable: true
      terms_version_id:
        description: TermsVersionID — с какой версии сняты числа. Только для истории.
        type: string
      updated_at:
        type: string
      videos_first_month:
        description: |-
          VideosFirstMonth/VideosNextMonths — за какой объём назван оклад.
          В тарифе это подпись «30 видео первый месяц, 60 со второго»: без
          неё сумма оклада ни о чём не говорит.
        type: integer
      videos_next_months:
        type: integer
    type: object
  internal_billing.TermsChange:
    properties:
      field:
        description: Field — имя поля тарифа (то же, что в JSON условий).
        type: string
      from:
        description: |-
          From/To — прежнее и новое значение. Пусто (nil) = «не задано»:
          креаторские ставки бывают незаполненными, и 0 от «как у клиента»
          одним числом не отличить.
        type: integer
      label:
        description: |-
          Label — человеческое название для интерфейса: админ читает
          «Ставка за 1000 просмотров», а не rate_per_1000_views.
        type: string
      to:
        type: integer
    type: object
  internal_billing.TermsMargin:
    properties:
      has_margin:
        description: |-
          HasMargin — креаторская сторона заполнена хоть где-то. Пустая
          означает «платим креатору ровно то, что берём», то есть нули ниже —
          настоящие нули, а не «не задано».
        type: boolean
      rate_per_1000_views:
        description: |-
          RatePer1000Views/RatePer1000ViewsOver — маржа на ставке за тысячу
          просмотров до порога и сверх него, копейки.
        type: integer
      rate_per_1000_views_over:
        type: integer
      salary_per_month:
        description: SalaryPerMonth — маржа на окладе за месяц, копейки.
