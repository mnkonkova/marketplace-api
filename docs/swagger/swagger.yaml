info:
  contact: {}
  description: 'Discovery-маркетплейс специалистов: каталог, поиск, лиды, отзывы.'
  title: marketpclce API
  version: "1.0"
paths:
  /admin/managers:
    get:
      parameters:
      - description: true|false
        in: query
        name: is_approved
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.managersListResp'
      security:
      - BearerAuth: []
      summary: Список менеджеров (с фильтром is_approved)
      tags:
      - admin-users
  /admin/managers/{id}/approve:
    post:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Аппрувить менеджера
      tags:
      - admin-users
  /admin/managers/{id}/revoke:
    post:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Снять аппрув с менеджера
      tags:
      - admin-users
  /admin/pipelines:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_pipelines.pipelineListResp'
      security:
      - BearerAuth: []
      summary: List pipelines (admin)
      tags:
      - admin-pipelines
    post:
      consumes:
      - application/json
      parameters:
      - description: pipeline
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_pipelines.createPipelineReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_pipelines.Pipeline'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_pipelines.errorResponse'
      security:
      - BearerAuth: []
      summary: Create pipeline (admin)
      tags:
      - admin-pipelines
  /admin/pipelines/{id}:
    delete:
      description: |-
        hard=true → физическое удаление из БД (cascade на stages/steps).
        Запрещено если есть любые проекты с этим pipeline_id.
        Без флага — soft-delete (is_active=false), запрет только при
        активных проектах (draft/active/on_hold/dispute).
      parameters:
      - description: pipeline id
        in: path
        name: id
        required: true
        type: string
      - description: true для hard-delete
        in: query
        name: hard
        type: boolean
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "409":
          description: has_active_projects | has_projects
          schema:
            $ref: '#/definitions/internal_pipelines.errorResponse'
      security:
      - BearerAuth: []
      summary: Soft- или hard-delete воронки (admin)
      tags:
      - admin-pipelines
    get:
      parameters:
      - description: pipeline id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_pipelines.PipelineFull'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_pipelines.errorResponse'
      security:
      - BearerAuth: []
      summary: Get pipeline with stages and steps (admin)
      tags:
      - admin-pipelines
    patch:
      consumes:
      - application/json
      parameters:
      - description: pipeline id
        in: path
        name: id
        required: true
        type: string
      - description: patch fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_pipelines.patchPipelineReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_pipelines.Pipeline'
      security:
      - BearerAuth: []
      summary: Patch pipeline (admin)
      tags:
      - admin-pipelines
  /admin/pipelines/{id}/reorder:
    put:
      consumes:
      - application/json
      parameters:
      - description: pipeline id
        in: path
        name: id
        required: true
        type: string
      - description: reorder payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_pipelines.ReorderInput'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Bulk reorder stages and steps within pipeline (admin)
      tags:
      - admin-pipelines
  /admin/pipelines/{id}/stages:
    post:
      consumes:
      - application/json
      parameters:
      - description: pipeline id
        in: path
        name: id
        required: true
        type: string
      - description: stage
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_pipelines.createStageReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_pipelines.Stage'
      security:
      - BearerAuth: []
      summary: Create stage under pipeline (admin)
      tags:
      - admin-pipelines
  /admin/pipelines/stages/{id}:
    delete:
      parameters:
      - description: stage id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete stage (admin)
      tags:
      - admin-pipelines
    patch:
      consumes:
      - application/json
      parameters:
      - description: stage id
        in: path
        name: id
        required: true
        type: string
      - description: patch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_pipelines.patchStageReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_pipelines.Stage'
      security:
      - BearerAuth: []
      summary: Patch stage (admin)
      tags:
      - admin-pipelines
  /admin/pipelines/stages/{id}/steps:
    post:
      consumes:
      - application/json
      parameters:
      - description: stage id
        in: path
        name: id
        required: true
        type: string
      - description: step
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_pipelines.createStepReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_pipelines.Step'
      security:
      - BearerAuth: []
      summary: Create step under stage (admin)
      tags:
      - admin-pipelines
  /admin/pipelines/steps/{id}:
    delete:
      parameters:
      - description: step id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete step (admin)
      tags:
      - admin-pipelines
    patch:
      consumes:
      - application/json
      parameters:
      - description: step id
        in: path
        name: id
        required: true
        type: string
      - description: patch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_pipelines.patchStepReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_pipelines.Step'
      security:
      - BearerAuth: []
      summary: Patch step (admin)
      tags:
      - admin-pipelines
  /admin/productions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_productions.listResp'
      security:
      - BearerAuth: []
      summary: Список всех продакшенов (включая деактивированные)
      tags:
      - admin-productions
    post:
      consumes:
      - application/json
      parameters:
      - description: name + description
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_productions.createReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_productions.Production'
        "400":
