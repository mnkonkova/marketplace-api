      description: Листит отзывы, отсортированные по дате убывания.
      parameters:
      - description: specialist user id
        in: path
        name: id
        required: true
        type: string
      - description: default 20, max 100
        in: query
        name: limit
        type: integer
      - description: default 0
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_reviews.listResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
      summary: Отзывы на специалиста (пагинация)
      tags:
      - reviews
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
