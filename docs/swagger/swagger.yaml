      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: дата выхода
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_publications.addSelfReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_publications.Publication'
        "400":
          description: bad_json; bad_id; bad_date — дата не в формате YYYY-MM-DD;
            invalid_input — дата в прошлом
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "404":
          description: not_found — проект не найден или вы не в его составе
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "409":
