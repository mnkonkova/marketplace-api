        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_reviews.createReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_reviews.Review'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
      security:
      - BearerAuth: []
      summary: Создать отзыв
      tags:
      - reviews
  /reviews/{id}:
    delete:
      description: Удаляет отзыв. Только автор отзыва.
      parameters:
      - description: review id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: no content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
      security:
      - BearerAuth: []
      summary: Удалить отзыв
      tags:
      - reviews
    patch:
      consumes:
      - application/json
      description: Изменяет рейтинг и/или текст отзыва. Только автор отзыва.
      parameters:
      - description: review id
        in: path
        name: id
        required: true
        type: string
      - description: patch payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_reviews.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_reviews.Review'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
      security:
      - BearerAuth: []
      summary: Изменить отзыв
      tags:
      - reviews
  /search:
    get:
      description: Возвращает hits + relaxed/similar если soft-фильтры не сошлись.
      parameters:
      - description: search text
        in: query
        name: q
        type: string
      - collectionFormat: csv
        description: category codes (multi)
        in: query
        items:
          type: string
        name: category
        type: array
      - collectionFormat: csv
        description: skill slugs (multi)
        in: query
        items:
          type: string
        name: skill
        type: array
      - description: city
        in: query
        name: city
        type: string
      - description: rate min
        in: query
        name: rate_min
        type: integer
      - description: rate max
        in: query
        name: rate_max
        type: integer
      - description: limit
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_search.Result'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_search.errorResponse'
      summary: Поиск специалистов
      tags:
      - search
  /search/summarize:
    post:
      consumes:
      - application/json
      description: По текстовому запросу/фильтрам поиска возвращает подобранную LLM-выдачу.
      parameters:
      - description: поисковые параметры
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_summarize.request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_summarize.Result'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_summarize.errorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_summarize.errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_summarize.errorResponse'
      summary: LLM-подбор «топ-N специалистов»
      tags:
      - llm
  /skills:
    get:
      parameters:
      - description: tool|platform|genre|skill
        in: query
        name: kind
        type: string
      - description: Код категории из /categories — отфильтровать навыки, релевантные
          категории (см. skill_categories). Платформы при фильтре по категории не
          возвращаются.
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_catalog.SkillsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_catalog.errorResponse'
      summary: Список навыков
      tags:
      - catalog
  /specialists/{handle}:
    get:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_profiles.PublicProfile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_profiles.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_profiles.errorResponse'
      summary: Публичный профиль специалиста
      tags:
      - profile
  /specialists/{id}/reviews:
    get:
      description: Листит отзывы, отсортированные по дате убывания.
      parameters:
      - description: specialist user id
        in: path
        name: id
        required: true
        type: string
      - description: default 20, max 100
        in: query
        name: limit
        type: integer
      - description: default 0
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_reviews.listResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
      summary: Отзывы на специалиста (пагинация)
      tags:
      - reviews
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
