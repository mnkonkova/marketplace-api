        name: thread
        type: string
      - description: чья ветка, при thread=creator
        in: query
        name: creator_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.commentsResp'
        "400":
          description: bad_id; bad_thread; bad_creator_id
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "403":
          description: forbidden_role — нужна роль админа
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Переписка любого проекта (админ)
      tags:
      - admin-projects
    post:
      consumes:
      - application/json
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_projects.commentReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_projects.Comment'
        "400":
          description: bad_json; bad_id; bad_creator_id; empty_comment; invalid_input
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "403":
          description: forbidden_role — нужна роль админа
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "404":
          description: not_a_project_creator — creator_id не в составе проекта
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Написать в переписку любого проекта (админ)
      tags:
      - admin-projects
  /admin/projects/{id}/events:
    get:
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.eventsResp'
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "403":
          description: forbidden_role — нужна роль админа
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Лента активности любого проекта (админ)
      tags:
      - admin-projects
  /admin/projects/{id}/mark_test:
    post:
      consumes:
      - application/json
