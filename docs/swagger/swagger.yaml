      summary: 'Админ-канбан: перенести проект на конкретный шаг'
      tags:
      - admin-projects
  /admin/projects/{id}/restore:
    post:
      description: |-
        Проект возвращается в тот статус, в котором был до отмены —
        он сохранён в payload события project_cancelled. Если такого
        события нет (отмена до появления ручки или правка статуса
        руками), отвечаем 409: угаданный статус молча меняет, кого
        проект ждёт.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.restoreResp'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "409":
          description: not_cancelled | no_cancel_event
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Вернуть отменённый проект
      tags:
      - admin-projects
  /admin/rating_scales:
    get:
      description: |-
        Версия не правится — выпускается следующая. У каждой видно,
        сколько проектов сняли с неё копию и сколько подытоженных
        периодов ею оценены: это и означает, что версию нельзя
        считать черновиком.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_ratings.scalesResp'
        "403":
          description: forbidden — нужна роль admin
          schema:
            $ref: '#/definitions/internal_ratings.errorResponse'
      security:
      - BearerAuth: []
      summary: 'Справочник порогов оценок: все версии (админ)'
      tags:
      - admin-ratings
    post:
      consumes:
      - application/json
      description: |-
        Существующая версия не переписывается: на ней живут проекты
        и подытоженные периоды, и правка задним числом переписала бы
        то, что клиент уже видел. В ответе — разница с прежней
        версией и сколько проектов на ней остались: за новой они не
        последуют, копия снимается один раз.
      parameters:
      - description: версия целиком
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_ratings.publishReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_ratings.PublishResult'
        "400":
          description: bad_json; invalid_input — границы не растут, доли не сходятся
            в 100%, нет площадки, у ориентира нет источника или даты
          schema:
            $ref: '#/definitions/internal_ratings.errorResponse'
        "403":
          description: forbidden — нужна роль admin
          schema:
            $ref: '#/definitions/internal_ratings.errorResponse'
      security:
      - BearerAuth: []
      summary: Выпустить версию справочника порогов (админ)
      tags:
      - admin-ratings
  /admin/rating_scales/current:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_ratings.Scale'
        "404":
          description: not_found — справочник пуст
          schema:
            $ref: '#/definitions/internal_ratings.errorResponse'
      security:
      - BearerAuth: []
      summary: Действующая версия справочника порогов (админ)
      tags:
      - admin-ratings
  /admin/search:
    get:
      description: |-
        Одна строка ищется и по названию проекта с именем клиента,
        и по почте, телефону и имени человека. Короче двух символов —
        пустой ответ. Тестовые записи не показываются.
      parameters:
      - description: строка поиска, мин 2 символа
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.GlobalSearchResult'
      security:
      - BearerAuth: []
      summary: Быстрый поиск по проектам и людям (⌘K)
      tags:
      - admin-search
  /admin/summary:
    get:
      description: |-
        Пункты считаются на сервере по единым правилам и приходят
        всегда, в том числе нулевыми — решает фронт. Тестовые
        проекты и пользователи не учитываются нигде.
        В nav_counts — цифры у пунктов бокового меню: отдельными
        ручками это было бы восемь запросов на каждый заход в CRM.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.Summary'
      security:
      - BearerAuth: []
      summary: 'Сводка: что требует внимания'
      tags:
      - admin-summary
  /admin/team:
    get:
      description: |-
        У каждого — сколько незавершённых проектов он ведёт,
        сколько из них просрочено (прошёл срок проекта либо дата
        невыложенной выкладки) и когда он последний раз входил.
        last_login_at отсутствует = не входил ни разу.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.teamResp'
      security:
      - BearerAuth: []
      summary: 'Команда: админы и менеджеры с нагрузкой'
      tags:
      - admin-users
  /admin/terms:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_billing.termsVersionsResp'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "403":
          description: forbidden — нужна роль admin
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
      security:
      - BearerAuth: []
      summary: 'Прайс площадки: все версии (админ)'
      tags:
      - admin-billing
    post:
      consumes:
      - application/json
      description: |-
        Существующая версия не переписывается: под ней стоит согласие клиентов, а проекты сняли с неё числа снимком.
        В ответе — разница с прежней действующей версией (changes) и
        сколько клиентов должны согласиться заново (consents_required).
      parameters:
      - description: ставки и текст условий
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_billing.publishTermsReq'
      produces:
      - application/json
      responses:
        "201":
          description: версия + разница с прежней + сколько клиентов должны согласиться
            заново
          schema:
            $ref: '#/definitions/internal_billing.TermsPublishResult'
        "400":
          description: bad_json, invalid_input — текст пуст или доля креатора больше
            цены клиента
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "403":
          description: forbidden — нужна роль admin
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
      security:
      - BearerAuth: []
      summary: Выпустить новую версию прайса (админ)
      tags:
      - admin-billing
  /admin/users:
    get:
      description: |-
        Фильтры: q (поиск ILIKE по email/phone/display_name, мин 2 символа),
        kind (client|specialist), role (manager|admin|regular),
        include_test (по умолчанию тестовые скрыты).
        Сортировка created_at DESC. limit 1..100, default 20.
      parameters:
      - description: часть email/phone/имени, мин 2 симв
        in: query
        name: q
        type: string
      - description: client | specialist
        in: query
        name: kind
        type: string
      - description: manager | admin | regular
        in: query
        name: role
        type: string
      - description: показать тестовых пользователей, default false
        in: query
        name: include_test
        type: boolean
      - description: 1-100, default 20
        in: query
        name: limit
        type: integer
      - description: default 0
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.UserListResult'
      security:
      - BearerAuth: []
      summary: Полный листинг всех юзеров с пагинацией (admin UI)
      tags:
      - admin-users
    post:
      consumes:
      - application/json
      parameters:
      - description: client data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_admin.createClientReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_admin.CreateClientResult'
      security:
      - BearerAuth: []
      summary: Создать клиента вручную (опц. сгенерить инвайт)
