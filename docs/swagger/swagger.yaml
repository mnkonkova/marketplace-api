      - admin-users
  /admin/users/{id}:
    get:
      description: |-
        Проекты — во всех ролях сразу (заказчик, исполнитель,
        ответственный менеджер). last_login_at отсутствует =
        не входил ни разу.
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.UserCard'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/internal_admin.errorResponse'
      security:
      - BearerAuth: []
      summary: 'Карточка человека: профиль, роли, модерация, проекты, журнал'
      tags:
      - admin-users
  /admin/users/{id}/activate:
    post:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Реактивировать ранее деактивированного юзера
      tags:
      - admin-users
  /admin/users/{id}/deactivate:
    post:
      description: |-
        is_active=FALSE — юзер не может логиниться, не светится в выдаче.
        Админов через UI деактивировать нельзя (400 invalid_input).
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Деактивировать юзера (мягкое отключение)
      tags:
      - admin-users
  /admin/users/{id}/generate_invite:
    post:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.InviteGenerateResult'
      security:
      - BearerAuth: []
      summary: Сгенерировать инвайт для существующего юзера
      tags:
      - admin-users
  /admin/users/{id}/login_link:
    post:
      description: |-
        Действует 72 часа и гасит предыдущую невостребованную
        ссылку этого человека. В отличие от
        /admin/users/{id}/generate_invite, цель может быть
        менеджером или админом — поэтому ручка смонтирована только
        в админской секции и отдельно перепроверяет, что просит
        действительно админ (роль могли снять после выдачи токена).
        Права при входе берутся из базы в момент обмена ссылки, а
        не из неё самой: ссылка не носит в себе никакой роли.
      parameters:
      - description: user id сотрудника
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.InviteGenerateResult'
        "403":
          description: forbidden_actor — роль админа снята
          schema:
            $ref: '#/definitions/internal_admin.errorResponse'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/internal_admin.errorResponse'
        "409":
          description: inactive_user — аккаунт отключён
          schema:
            $ref: '#/definitions/internal_admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Одноразовая ссылка для входа сотруднику (админ)
      tags:
      - admin-users
  /admin/users/{id}/mark_test:
    post:
      consumes:
      - application/json
      description: |-
        Тестовые пользователи по умолчанию скрыты из админских
        выдач (include_test=true показывает их). Админа пометить
        нельзя — он пропал бы из списка команды.
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      - description: is_test
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_admin.markUserTestReq'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid_input — попытка пометить админа
          schema:
            $ref: '#/definitions/internal_admin.errorResponse'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/internal_admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Пометить пользователя тестовым (или снять пометку)
      tags:
      - admin-users
  /admin/users/{id}/verify_email:
    post:
      description: Идемпотентно. Если email уже подтверждён — 204 без изменений.
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Подтвердить email юзера вручную (для админского заноса)
      tags:
      - admin-users
  /admin/users/search:
    get:
      description: |-
        ILIKE по email/phone/display_name. Только активные,
        фильтр kind=client|specialist. q короче 2 символов — пусто.
      parameters:
      - description: часть email/phone/имени, мин 2 символа
        in: query
        name: q
        required: true
        type: string
      - description: client | specialist
        in: query
        name: kind
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.userSearchResp'
      security:
      - BearerAuth: []
      summary: Поиск юзеров (для лукапов в CRM)
      tags:
      - admin-users
  /auth/email-available:
    get:
      parameters:
      - description: Проверяемый адрес
        in: query
        name: email
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.emailAvailableResp'
      summary: Свободен ли email для регистрации
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.TokenPair'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
      summary: Логин по email/телефону и паролю
      tags:
      - auth
  /auth/password-reset/confirm:
    post:
      consumes:
      - application/json
      parameters:
      - description: token + новый пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.passwordResetConfirmReq'
      produces:
      - application/json
      responses:
        "200":
          description: свежая пара tokens — фронт может авто-логинить
          schema:
            $ref: '#/definitions/internal_auth.TokenPair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
        "410":
          description: 'token_invalid: токен неизвестен, использован или просрочен'
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
      summary: Применить новый пароль по токену из письма
      tags:
      - auth
  /auth/password-reset/request:
    post:
      consumes:
      - application/json
      description: |-
        Всегда 204 (anti-enumeration). Если email зарегистрирован,
        на него уйдёт письмо со ссылкой DOMAIN/auth/reset?token=...
      parameters:
      - description: email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.passwordResetRequestReq'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
      summary: Запросить ссылку сброса пароля
      tags:
      - auth
  /auth/redeem_invite/{token}:
    post:
      parameters:
      - description: raw invite token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.redeemResp'
        "410":
          description: invite_invalid
          schema:
            $ref: '#/definitions/internal_admin.errorResponse'
      summary: Обменять magic-link на JWT (публичный)
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.refreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.TokenPair'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
      summary: Обмен refresh-токена на новую пару
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: |-
        При невалидном вводе или занятом email отвечает 400 invalid_input
        (разные причины не различаются — anti-enumeration).
      parameters:
      - description: регистрационные данные
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.registerReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_auth.registerResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /auth/resend-verification:
    post:
      description: Гасит прошлые токены и шлёт новое письмо. Cooldown 60s по user_id.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
        "429":
          description: resend_cooldown
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
      security:
      - BearerAuth: []
      summary: Перевыслать письмо подтверждения email
      tags:
      - auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      parameters:
      - description: token из ссылки в письме
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.verifyEmailReq'
      produces:
      - application/json
      responses:
        "200":
          description: новая пара токенов с актуальным email_verified
          schema:
            $ref: '#/definitions/internal_auth.TokenPair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
        "410":
          description: 'token_invalid: токен неизвестен, использован, просрочен или
            email сменился'
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
      summary: Подтвердить email по токену из письма
      tags:
      - auth
  /auth/yandex:
    post:
      description: |-
        Принимает одноразовый code из redirect'а Яндекса, обменивает
        его на профиль и выдаёт пару токенов. Регистрация и вход —
        одна ручка: человек не должен помнить, заводил ли аккаунт.
      parameters:
      - description: code из redirect_uri
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_auth.yandexReq'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.registerResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
      summary: Вход и регистрация через Яндекс
      tags:
      - auth
  /categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_catalog.CategoriesResponse'
      summary: Список категорий специалистов
      tags:
      - catalog
  /categories/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_search.categoryStatsResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_search.errorResponse'
      summary: Кол-во специалистов в каждой категории
      tags:
      - search
  /clarify:
    post:
      consumes:
      - application/json
      description: LLM возвращает следующий вопрос или конечный поисковый запрос (done=true).
      parameters:
      - description: история диалога
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_clarify.request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_clarify.Result'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_clarify.errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_clarify.errorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_clarify.errorResponse'
      summary: Уточняющий диалог по брифу
      tags:
      - llm
  /feed:
    get:
      description: Возвращает специалистов и связанные видео из портфолио. Поддерживает
        фильтры и cursor-пагинацию.
      parameters:
      - description: search text (игнорируется если задан ids)
        in: query
        name: q
        type: string
      - collectionFormat: csv
        description: category codes (multi, csv; игнорируется если задан ids)
        in: query
        items:
          type: string
        name: category
        type: array
      - collectionFormat: csv
        description: skill slugs (multi, csv; игнорируется если задан ids)
        in: query
        items:
          type: string
        name: skill
        type: array
      - description: city (игнорируется если задан ids)
        in: query
        name: city
        type: string
      - collectionFormat: csv
        description: 'user_id (csv, до 100) — жёсткий фильтр: показывать видео только
          этих спецов'
        in: query
        items:
          type: string
        name: ids
        type: array
      - description: видео на специалиста
        in: query
        name: per_specialist
        type: integer
      - description: cursor токен
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_feed.Result'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_feed.feedError'
      summary: Лента «портфолио по категориям»
      tags:
      - feed
  /leads:
    post:
      consumes:
      - application/json
      description: Менеджер/клиент создаёт лид и выбирает специалистов-получателей.
        В ответе — id и контакты выбранных спецов (видны только создателю).
      parameters:
      - description: lead payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_leads.createReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_leads.CreateResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_leads.errorResponse'
        "403":
          description: email_unverified — для авторизованного клиента email должен
            быть подтверждён
          schema:
            $ref: '#/definitions/internal_leads.errorResponse'
      security:
      - BearerAuth: []
      summary: Создать заявку (lead)
      tags:
      - leads
  /manager/checklist_templates:
    get:
      description: |-
        Из чего выбирать при подключении чеклиста к проекту.
        Выключенные шаблоны не показываются: подключить их нельзя.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_publications.templatesResp'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
      security:
      - BearerAuth: []
      summary: Библиотека чеклистов (менеджер)
      tags:
      - manager-publications
  /manager/orders:
    get:
      description: |-
        Резерв кончился, а состав не собран — дальше автоматика
        сделать ничего не может.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_orders.ordersListResp'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
      security:
      - BearerAuth: []
      summary: Заказы, где нужен менеджер
      tags:
      - manager-orders
  /manager/orders/{id}/candidates:
    post:
      consumes:
      - application/json
      description: |-
        Приоритеты продолжают существующие. Если место свободно,
        приглашение уходит немедленно.
      parameters:
      - description: order id
        in: path
        name: id
        required: true
        type: string
      - description: кого добавить в резерв
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_orders.addCandidatesReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_orders.Order'
        "400":
          description: bad_json; bad_id
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "404":
          description: not_found — заказ не найден
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "409":
          description: wrong_status — заказ уже укомплектован, оплачен или отменён
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
      security:
      - BearerAuth: []
      summary: Добрать людей в подборку (менеджер)
      tags:
      - manager-orders
  /manager/orders/{id}/invite:
    post:
      description: |-
        Обычно очередь двигается сама: отказ и сгоревшее
        приглашение сразу отдают место следующему. Ручка нужна там,
        где автоматике нечего было двигать — например, заказ остался
        черновиком и приглашения не ушли вовсе.
        Приглашение уходит только на реально свободное место
        (needed − accepted − invited); если звать некого, это 409, а
        не тихий успех.
      parameters:
      - description: order id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_orders.Order'
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "404":
          description: not_found — заказ не найден
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "409":
          description: wrong_status — заказ собран, оплачен или отменён; no_free_slot
            — свободных мест нет или резерв кончился
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
      security:
      - BearerAuth: []
      summary: Позвать следующих по приоритету (менеджер)
      tags:
      - manager-orders
  /manager/orders/{id}/paid:
    post:
      description: |-
        Платежей в системе нет, отметка ручная. Проект после этого
        менеджер создаёт сам — авто-создания нет намеренно.
      parameters:
      - description: order id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_orders.Order'
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "404":
          description: not_found — заказ не найден
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "409":
          description: wrong_status — оплатить можно только укомплектованный заказ
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
      security:
      - BearerAuth: []
      summary: Отметить оплату (менеджер)
      tags:
      - manager-orders
  /manager/projects:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.managerListResp'
      security:
      - BearerAuth: []
      summary: Мои проекты (assigned_to=me) — для канбана
      tags:
      - manager-projects
    post:
      consumes:
      - application/json
      description: |-
        kind задаёт вид проекта: creators_turnkey (выкладки),
        production_turnkey (воронка, по умолчанию) или general.
        pipeline_id обязателен только для production_turnkey — у
        двух других видов воронки нет.
        Если client_user_id
        не передан, требуется client_name+client_contact (no-account
        клиент). assigned_to_user_id принудительно ставится в текущего
        менеджера — менеджер не может вешать чужой проект на коллегу.
      parameters:
      - description: project
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_projects.managerCreateProjectReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_projects.Project'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: 'Менеджер: создать проект вручную (включая клиента без аккаунта)'
      tags:
      - manager-projects
  /manager/projects/{id}:
    get:
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.ProjectFullView'
      security:
      - BearerAuth: []
      summary: Полный вид моего проекта (все стадии и шаги)
      tags:
      - manager-projects
    patch:
      consumes:
      - application/json
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: patch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_projects.ManagerPatchInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.Project'
        "409":
          description: stale_updated_at
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Inline-редактирование title/budget/notes
      tags:
      - manager-projects
  /manager/projects/{id}/accruals/{accrual_id}/approve:
    post:
      description: После утверждения строка не пересчитывается.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: accrual id
        in: path
        name: accrual_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_billing.Accrual'
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "404":
          description: not_found — начисление не найдено
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "409":
          description: wrong_accrual_status — период уже утверждён или выплачен
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
      security:
      - BearerAuth: []
      summary: Утвердить период (менеджер)
      tags:
      - manager-billing
  /manager/projects/{id}/accruals/{accrual_id}/paid:
    post:
      description: |-
        Только после утверждения: между «посчитали» и «отправили
        деньги» проходит время, и путать их нельзя.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: accrual id
        in: path
        name: accrual_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_billing.Accrual'
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "404":
          description: not_found — начисление не найдено
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "409":
          description: wrong_accrual_status — период не утверждён или уже выплачен
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
      security:
      - BearerAuth: []
      summary: Отметить выплату (менеджер)
      tags:
      - manager-billing
  /manager/projects/{id}/accruals/recalc:
    post:
      description: |-
        Считается по фактам: выкладки месяца, их статус и просмотры
        из ежедневного сбора. Недосданные ролики не оплачиваются —
        вычет пропорционален недостаче. Бонус идёт только с роликов,
        перешагнувших порог просмотров. Утверждённые и выплаченные
        строки не трогаются.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: номер периода проекта, по умолчанию текущий
        in: query
        name: period
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_billing.accrualsResp'
        "400":
          description: bad_id; bad_period
          schema:
