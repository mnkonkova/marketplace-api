  internal_profiles.PatchFullInput:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      categories:
        $ref: '#/definitions/internal_profiles.CategoriesPart'
      city:
        type: string
      contact_email:
        type: string
      contact_phone:
        type: string
      currency:
        type: string
      display_name:
        type: string
      is_freelance:
        type: boolean
      production_id:
        description: |-
          Выбор работодателя специалиста (XOR). См. ProductionID/IsFreelance
          в Profile. Семантика поля:
            ProductionID = *string —  "uuid" → выбрать; "" → снять (SET NULL);
                                       nil/опущено → не трогать
            IsFreelance  = *bool   —  true → стать фрилансером; false → выключить
                                       фриланс; nil → не трогать.
          Сервис нормализует: при IsFreelance=true автоматически снимает
          production_id, при выборе production_id — снимает is_freelance.
          Конфликт (production_id=valid AND is_freelance=true) → ErrInvalidInput.
        type: string
      rate_max:
        type: integer
      rate_min:
        type: integer
      skills:
        $ref: '#/definitions/internal_profiles.SkillsPart'
      social_links:
        $ref: '#/definitions/internal_profiles.SocialLinks'
      updated_at:
        type: string
      username:
        description: |-
          Username — публичный handle. nil = не трогать; "" = сбросить в NULL;
          валидируется сервисом, см. ValidateUsername.
        type: string
    type: object
  internal_profiles.PortfolioCreateInput:
    properties:
      aspect:
        type: string
      category_codes:
        items:
          type: string
        type: array
      description:
        type: string
      duration_sec:
        type: integer
      profile_categories:
        description: |-
          ProfileCategories — текущий form-state категорий профиля с фронта.
          Используется для валидации video.CategoryCodes когда юзер только что
          зарегистрировался и форма с категориями ещё не сохранена в БД.
          Если поле есть — backend проверяет CategoryCodes ⊆ ProfileCategories.
          Если nil/пустое — fallback на profile.Categories из БД (старое поведение).
        items:
          type: string
        type: array
      thumbnail_url:
        type: string
      title:
        type: string
      video_url:
        type: string
    type: object
