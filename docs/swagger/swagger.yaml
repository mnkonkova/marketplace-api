        x-nullable: true
      creator_step_fee:
        type: integer
        x-nullable: true
      creator_step_fee_over:
        type: integer
        x-nullable: true
      first_period_fee:
        description: |-
          FirstPeriodFee — фикс за первый период проекта: там оплачивается
          запуск, а не результат, и ступени не считаются вовсе.
        type: integer
        x-nullable: true
      guarantee_views:
        description: |-
          GuaranteeViews — гарантия в просмотрах. Недобрали — период всё
          равно оплачивается как гарантия, а недостающие просмотры уходят в
          долг перед клиентом и гасятся из следующего периода. Долг в
          ПРОСМОТРАХ, а не в деньгах: так в оферте.
        type: integer
        x-nullable: true
      is_current:
        description: |-
          IsCurrent — эта версия сейчас действует. Действует всегда одна:
          самая новая.
        type: boolean
      margin:
        allOf:
        - $ref: '#/definitions/internal_billing.TermsMargin'
        description: |-
          Margin — что из уплаченного клиентом остаётся площадке. Считается,
          а не хранится: это разность двух сторон тарифа, и отдельная колонка
          разошлась бы с ними на первой же правке ставок.
      project_id:
        type: string
      published_at:
        type: string
      rate_per_1000_views:
        description: RatePer1000Views — ставка за тысячу просмотров ДО порога, копейки.
        type: integer
      rate_per_1000_views_over:
        description: |-
          RatePer1000ViewsOver — ставка за тысячу просмотров СВЕРХ порога.
