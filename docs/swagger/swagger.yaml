    type: object
  internal_billing.TermsPublishResult:
    properties:
      base_fee:
        description: BaseFee — фикс со второго периода.
        type: integer
        x-nullable: true
      body:
        description: Body — текст условий, с которым соглашается клиент.
        type: string
      bonus_views_threshold:
        description: |-
          BonusViewsThreshold — порог НА РОЛИК, суммой по пяти площадкам.
          До него платим полную ставку, свыше — пониженную. 0 = порога нет,
          весь объём идёт по полной ставке.
        type: integer
      changes:
        description: |-
          Changes — разница с прежней действующей версией. Пусто у самой
          первой версии: сравнивать не с чем.
        items:
          $ref: '#/definitions/internal_billing.TermsChange'
        type: array
      click_bonus_rate:
        description: |-
          ClickBonusRate — ставка за переход по UTM до месячного порога,
          копейки. nil = бонус за переходы не считается: источник кликов не
          подключён, а поля в тарифе есть.
        type: integer
        x-nullable: true
      click_bonus_rate_over:
        description: ClickBonusRateOver — ставка за каждый следующий переход.
        type: integer
        x-nullable: true
      click_bonus_threshold:
        description: |-
          ClickBonusThreshold — сколько переходов ЗА МЕСЯЦ идёт по полной
          ставке. Порог здесь месячный, а не на ролик — в отличие от просмотров.
        type: integer
      consented_clients:
        description: |-
          ConsentedClients — сколько клиентов уже согласились именно с ней.
          Показывает, что версию нельзя считать черновиком.
        type: integer
      consents_required:
        description: |-
          ConsentsRequired — сколько клиентов согласились с прежней
          действующей версией и теперь должны согласиться заново.
        type: integer
