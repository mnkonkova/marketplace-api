info:
  contact: {}
  description: 'Discovery-маркетплейс специалистов: каталог, поиск, лиды, отзывы.'
  title: marketpclce API
  version: "1.0"
paths:
  /admin/audit:
    get:
      description: |-
        Фильтры: actor (uuid сотрудника), action (точный код,
        например user.revoke_manager), object_type (user | project |
        terms_version | checklist_template), object_id, from/to
        (RFC3339, полуинтервал). Свежие сверху.
      parameters:
      - description: uuid сотрудника
        in: query
        name: actor
        type: string
      - description: код действия
        in: query
        name: action
        type: string
      - description: user | project | terms_version | checklist_template
        in: query
        name: object_type
        type: string
      - description: id объекта
        in: query
        name: object_id
        type: string
      - description: RFC3339, включительно
        in: query
        name: from
        type: string
      - description: RFC3339, не включая
        in: query
        name: to
        type: string
      - description: 1-200, default 50
        in: query
        name: limit
        type: integer
      - description: default 0
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.AuditResult'
        "400":
          description: bad_actor | bad_time | invalid_input
          schema:
            $ref: '#/definitions/internal_admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Журнал админских действий
      tags:
      - admin-audit
  /admin/checklist_templates:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_publications.templatesResp'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "403":
          description: forbidden — нужна роль admin
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
      security:
      - BearerAuth: []
      summary: Библиотека чеклистов (админ)
      tags:
      - admin-publications
    post:
      consumes:
      - application/json
      description: |-
        Правки на месте нет намеренно: шаблон уходит в проекты снимком,
        и подмена пунктов под идущими проектами означала бы, что креатор
        отмечал одно, а спросят с него другое. Прежняя версия гасится.
      parameters:
      - description: шаблон целиком
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_publications.saveTemplateReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_publications.ChecklistTemplateFull'
        "400":
          description: bad_json; invalid_input — пустое название, нет пунктов, неизвестная
            площадка
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "404":
          description: not_found — заменяемой версии нет или она уже погашена
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
      security:
      - BearerAuth: []
      summary: Выпустить версию шаблона чеклиста (админ)
      tags:
      - admin-publications
  /admin/checklist_templates/{id}:
    delete:
      description: 'Проекты, куда он уже подключён, не меняются: у них свой снимок.'
      parameters:
      - description: template id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "404":
          description: not_found — шаблона нет или он уже погашен
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
      security:
      - BearerAuth: []
