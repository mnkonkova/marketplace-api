  marketpclce_internal_profiles.PortfolioItem:
    properties:
      animated_thumb_url:
        type: string
      aspect:
        description: |-
          Aspect — «W:H» исходника, сокращённое до несократимой дроби и
          прижатое к стандартным форматам ("9:16", "16:9", "1:1", "4:5"…).
          Заполняется transcode-воркером через ffprobe (см. transcode.Probe).
          Пусто = ещё не пробировано (запись старше миграции 00028 и не прошла
          cmd/backfill-aspect, либо ffprobe недоступен) — фронт в этом случае
          меряет размеры сам на loadedmetadata.
        type: string
      category_codes:
        items:
          type: string
        type: array
      created_at:
        type: string
      description:
        type: string
      duration_sec:
        description: DurationSec — длительность оригинала, для метки на плитке. 0
          = неизвестна.
        type: integer
      external_url:
        type: string
      id:
        type: string
      images:
        description: |-
          Images — для Kind='image' список фото в карусели (упорядочен по sort_order).
          Для других kind — nil/пусто.
        items:
          $ref: '#/definitions/marketpclce_internal_profiles.PortfolioImage'
        type: array
      is_featured:
        description: |-
          IsFeatured — закреплённая промо-работа, флагман на публичной странице.
          Не более одной на специалиста (partial unique index, миграция 00028).
        type: boolean
      kind:
        description: |-
          Kind — 'video' | 'image' | 'external'. Фронт по нему выбирает рендер:
          video — плеер; image — карусель из Images; external — внешняя ссылка.
        type: string
      preview_status:
        description: pending|processing|ready|failed
        type: string
      preview_url:
        description: |-
          Preview-видео (480p, 5-10 сек, ~500KB) для autoplay в фиде.
          Генерируется worker'ом async (см. docs/VIDEO_TRANSCODING.md).
          Пока PreviewStatus != "ready", фронт должен фолбэчить на VideoURL.
        type: string
      sort_order:
        type: integer
      thumbnail_url:
        type: string
      title:
        type: string
      updated_at:
        type: string
      video_url:
        type: string
    type: object
  marketpclce_internal_profiles.PublicProfile:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      categories:
        items:
          $ref: '#/definitions/marketpclce_internal_profiles.CategoryRef'
        type: array
      city:
        type: string
      currency:
        type: string
      display_name:
        type: string
      is_freelance:
        type: boolean
      is_preview:
        description: |-
          IsPreview=true означает что профиль возвращён в owner-preview режиме —
          спец сам смотрит свой профиль ещё до publish/approval, фронт показывает
          баннер «Это превью — клиенты увидят после публикации».
        type: boolean
      is_published:
        description: |-
          IsPublished — фактический статус. Нужен фронту в preview-режиме чтобы
          различить «черновик» (false) от «на модерации» (true + not approved).
        type: boolean
      moderation_status:
        type: string
      portfolio:
        items:
          $ref: '#/definitions/marketpclce_internal_profiles.PortfolioItem'
        type: array
      production_name:
        description: |-
          ProductionName — название студии, в которой работает спец. Пусто, если
          спец фрилансер или ещё не выбрал. IsFreelance=true говорит «я сам по
          себе» (тогда ProductionName всегда пусто). На фронте: name → как есть;
          is_freelance → «Фриланс»; оба пусты → ничего не показываем.
        type: string
      rate_max:
        type: integer
      rate_min:
        type: integer
      rating_avg:
        type: number
      reviews:
        items:
          $ref: '#/definitions/marketpclce_internal_profiles.Review'
        type: array
      reviews_count:
        type: integer
      skills:
        items:
          $ref: '#/definitions/marketpclce_internal_profiles.SkillRef'
        type: array
      social_links:
        allOf:
        - $ref: '#/definitions/marketpclce_internal_profiles.SocialLinks'
        description: |-
          SocialLinks — соцсети для прямого контакта (telegram/whatsapp/vk/etc).
          Если все пусты, фронт не рендерит блок.
      user_id:
        type: string
      username:
        description: |-
          Username — публичный handle для красивого URL /specialist/<username>.
          Пусто, если спец ещё не выбрал — фронт фолбэчит на user_id.
        type: string
    type: object
  marketpclce_internal_profiles.Review:
