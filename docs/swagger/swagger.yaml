info:
  contact: {}
  description: 'Discovery-маркетплейс специалистов: каталог, поиск, лиды, отзывы.'
  title: marketpclce API
  version: "1.0"
paths:
  /admin/managers:
    get:
      parameters:
      - description: true|false
        in: query
        name: is_approved
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.managersListResp'
      security:
      - BearerAuth: []
      summary: Список менеджеров (с фильтром is_approved)
      tags:
      - admin-users
  /admin/managers/{id}/approve:
    post:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Аппрувить менеджера
      tags:
      - admin-users
  /admin/managers/{id}/revoke:
    post:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Снять аппрув с менеджера
      tags:
      - admin-users
  /admin/managers/promote:
    post:
      consumes:
      - application/json
      description: |-
        Ищется юзер через /admin/users/search, далее этот endpoint
        выставляет is_manager=TRUE и is_approved=TRUE. send_invite=true
        дополнительно генерит magic-link для входа.
      parameters:
      - description: user_id + send_invite
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_admin.promoteManagerReq'
      produces:
      - application/json
      responses:
        "200":
          description: '{} если send_invite=false'
          schema:
            $ref: '#/definitions/internal_admin.InviteGenerateResult'
      security:
      - BearerAuth: []
      summary: Сделать существующего юзера менеджером (+ опционально invite)
      tags:
      - admin-users
  /admin/moderation/specialists:
    get:
      parameters:
      - description: pending_review (default) | approved | rejected | all
        in: query
        name: status
        type: string
      - description: 1-100, default 20
        in: query
        name: limit
        type: integer
      - description: default 0
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.moderationListResp'
      security:
      - BearerAuth: []
      summary: Очередь модерации специалистов
      tags:
      - admin-moderation
  /admin/moderation/specialists/{id}:
    get:
      description: |-
        В отличие от /specialists/{id} (только approved+published),
        эта ручка отдаёт и pending, и rejected — чтобы админ мог
        принимать решение.
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/marketpclce_internal_profiles.PublicProfile'
