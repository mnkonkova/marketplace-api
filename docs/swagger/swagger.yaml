        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_publications.Report'
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "404":
          description: not_found — вы не участник этого проекта
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "410":
