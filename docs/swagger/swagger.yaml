            $ref: '#/definitions/internal_orders.ordersListResp'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
      security:
      - BearerAuth: []
      summary: Мои заказы на подбор (заказчик)
      tags:
      - client-orders
    post:
      consumes:
      - application/json
      parameters:
      - description: состав заказа
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_orders.createOrderReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_orders.CreateResult'
        "400":
          description: bad_json; bad_month; invalid_input — объём, месяц в прошлом,
            пустой id; not_enough_candidates — в подборке меньше, чем нужно взять;
            duplicate_candidate
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "403":
          description: no_consent — не приняты условия работы
          schema:
