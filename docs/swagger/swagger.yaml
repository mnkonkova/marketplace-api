  /manager/projects/{id}/comments:
    get:
      description: |-
        Без параметров — вся переписка: клиентская ветка, ветки
        креаторов и внутренние заметки. thread сужает до одной ветки;
        для thread=creator нужен creator_id.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: client | creator | internal
        in: query
        name: thread
        type: string
      - description: чья ветка, при thread=creator
        in: query
        name: creator_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.commentsResp'
        "400":
          description: bad_id; bad_thread — неизвестное значение; bad_creator_id —
            не uuid или не задан при thread=creator
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "404":
          description: not_found — проект не найден или ведёт другой менеджер
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Переписка проекта (менеджер)
      tags:
      - manager-projects
    post:
      consumes:
      - application/json
      description: |-
        thread выбирает ветку: client (по умолчанию), creator (нужен
        creator_id) или internal. Прежнее поле is_internal=true
        равнозначно thread=internal.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_projects.commentReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_projects.Comment'
        "400":
          description: bad_json; bad_id; bad_creator_id; empty_comment — пустое сообщение;
            invalid_input — превышена длина или неизвестный body_format
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "404":
          description: not_found — проект не найден или ведёт другой менеджер; not_a_project_creator
            — creator_id не в составе проекта
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Написать в переписку проекта (менеджер)
      tags:
      - manager-projects
  /manager/projects/{id}/comments/participants:
    get:
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: client (по умолчанию) | creator | internal
        in: query
        name: thread
        type: string
      - description: чья ветка, при thread=creator
        in: query
        name: creator_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.participantsResp'
        "400":
          description: bad_id; bad_thread; bad_creator_id
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "404":
          description: not_found — проект не найден или ведёт другой менеджер
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Кого можно упомянуть в ветке (менеджер)
      tags:
      - manager-projects
