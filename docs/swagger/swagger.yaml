        Что подписано, что оплачено и состав месяца: кто сколько
        роликов сдал и во сколько это обошлось. Заказчик за эту
        команду платит, поэтому строки начислений — его счёт.
        UTM-метки ему не отдаются: это инструмент менеджера.
        Выплат креаторам, маржи площадки и креаторской стороны
        тарифа в ответе нет — ответ собирается отдельным типом,
        а не чисткой менеджерской структуры.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: номер периода проекта, по умолчанию текущий
        in: query
        name: period
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_billing.ClientBillingView'
        "400":
          description: bad_id; bad_period — номер периода не целое число
          schema:
