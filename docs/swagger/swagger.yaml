  internal_profiles.Profile:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      categories:
        items:
          type: string
        type: array
      city:
        type: string
      contact_email:
        description: |-
          Контакты для прямой связи. Возвращаются только владельцу профиля
          (через /me/profile) и менеджеру после создания заявки (см. /leads).
          В публичные DTO (PublicProfile, search.IndexDoc, feed.Specialist) НЕ
          попадают — это видимость не для feed'а.
        type: string
      contact_phone:
        type: string
      currency:
        type: string
      display_name:
        type: string
      is_freelance:
        type: boolean
      is_published:
        type: boolean
      moderation_reason:
        type: string
      moderation_reviewed_at:
        type: string
      moderation_status:
        description: |-
          ModerationStatus — статус модерации публикации админом
          (см. docs/SPECIALIST_MODERATION.md). В каталог попадает только
          is_published=TRUE AND moderation_status='approved'. Возвращается
          только владельцу профиля (через /me/profile) — публичная PublicProfile
          этот статус не отдаёт.
        type: string
      primary_category:
        type: string
      production_id:
        description: |-
          ProductionID / IsFreelance — выбор работодателя специалиста.
          XOR на уровне CHECK constraint (см. 00010_crm.sql). Оба NULL/false =
          выбор ещё не сделан (фронт показывает приглашение выбрать).
        type: string
      rate_max:
        type: integer
      rate_min:
        type: integer
      rating_avg:
        type: number
      reviews_count:
        type: integer
      skill_ids:
        items:
          type: string
        type: array
      social_links:
        allOf:
        - $ref: '#/definitions/internal_profiles.SocialLinks'
        description: SocialLinks — заполняет сам спец из кабинета.
      updated_at:
        description: |-
          UpdatedAt — версия профиля для optimistic locking.
          Клиент должен прислать это значение обратно в PatchInput.UpdatedAt,
          чтобы защититься от lost-update при параллельных PATCH'ах.
        type: string
      user_id:
        type: string
      username:
        description: Username — публичный handle. Пусто = не выбрал. См. PublicProfile.Username.
        type: string
    type: object
  internal_profiles.PublicProfile:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      categories:
        items:
          $ref: '#/definitions/internal_profiles.CategoryRef'
        type: array
      city:
        type: string
      currency:
        type: string
      display_name:
        type: string
      is_freelance:
        type: boolean
      is_preview:
        description: |-
          IsPreview=true означает что профиль возвращён в owner-preview режиме —
          спец сам смотрит свой профиль ещё до publish/approval, фронт показывает
          баннер «Это превью — клиенты увидят после публикации».
        type: boolean
      is_published:
        description: |-
          IsPublished — фактический статус. Нужен фронту в preview-режиме чтобы
          различить «черновик» (false) от «на модерации» (true + not approved).
        type: boolean
      moderation_status:
        type: string
      portfolio:
        items:
          $ref: '#/definitions/internal_profiles.PortfolioItem'
        type: array
      production_name:
        description: |-
          ProductionName — название студии, в которой работает спец. Пусто, если
          спец фрилансер или ещё не выбрал. IsFreelance=true говорит «я сам по
          себе» (тогда ProductionName всегда пусто). На фронте: name → как есть;
          is_freelance → «Фриланс»; оба пусты → ничего не показываем.
        type: string
      rate_max:
        type: integer
      rate_min:
        type: integer
      rating_avg:
        type: number
      reviews:
        items:
          $ref: '#/definitions/internal_profiles.Review'
        type: array
      reviews_count:
        type: integer
      skills:
        items:
          $ref: '#/definitions/internal_profiles.SkillRef'
        type: array
      social_links:
        allOf:
        - $ref: '#/definitions/internal_profiles.SocialLinks'
        description: |-
          SocialLinks — соцсети для прямого контакта (telegram/whatsapp/vk/etc).
          Если все пусты, фронт не рендерит блок.
      user_id:
        type: string
      username:
        description: |-
          Username — публичный handle для красивого URL /specialist/<username>.
          Пусто, если спец ещё не выбрал — фронт фолбэчит на user_id.
        type: string
    type: object
