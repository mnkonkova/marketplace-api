        Поиск, фильтры, сортировка и пагинация считаются на сервере.
        q — ILIKE по названию проекта и по клиенту (имя в профиле,
        имя на проекте у клиента без аккаунта, почта), мин 2 символа.
        manager — uuid ответственного либо "none" (без ответственного).
        status — точный статус проекта либо unfinished: «в работе»,
        то есть draft, active, on_hold и dispute разом. Именно это
        значение даёт тот же набор, что nav_counts.projects_active в
        сводке; пустой status отдаёт всё, кроме отменённых, то есть
        вместе с завершёнными.
        include_test=true показывает проекты, помеченные как тестовые
        (по умолчанию скрыты). kind — вид проекта. sort: updated_asc |
        updated_desc | created_asc | created_desc, default updated_desc.
        У каждой карточки прогресс ещё и числом: progress_done /
        progress_total, единица в progress_unit (publications у
        креаторов, steps у продакшна).
