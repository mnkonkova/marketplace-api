      consumes:
      - application/json
      description: |-
        План периода выполнен, а до ступени просмотров не хватает —
        креатор заводит себе ролик сам, без согласования с менеджером.
        Дальше выкладка живёт как обычная: пять площадок, чеклист проекта,
        сбор статистики. В знаменатель недосдачи она не попадает.
