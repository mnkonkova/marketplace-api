      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: is_test
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_projects.markTestReq'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
