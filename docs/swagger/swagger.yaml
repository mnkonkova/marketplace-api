        "409":
          description: too_many_creators — в первый месяц доступен один креатор, со
            второго до трёх; not_a_creator — в пакет берутся только блогеры и авторы
            UGC; creator_busy — кто-то занят в этом месяце
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
      security:
      - BearerAuth: []
