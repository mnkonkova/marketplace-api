  /me/orders/{id}/cancel:
    post:
      description: Приглашения отзываются, приглашённые получают уведомление.
      parameters:
      - description: order id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_orders.Order'
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "404":
          description: not_found — заказ не ваш
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "409":
          description: wrong_status — заказ уже оплачен или отменён
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
      security:
      - BearerAuth: []
      summary: Распустить состав (заказчик)
      tags:
      - client-orders
  /me/orders/{id}/estimate:
    get:
      description: |-
        Оклады известны точно, бонус — прогноз: он зависит от
        просмотров, которых ещё нет. Прогноз строится по истории
        тех самых людей, что в подборке — по их сданным роликам в
        любых проектах. По кому истории нет, тот в среднее не
        входит и посчитан в without_history: считать новичка нулём
        значит занизить смету ровно настолько, насколько подборка
        новая. Если истории нет ни у кого, has_forecast=false и
        показывать надо только оклады — бонус не ноль, а неизвестен.
        Условия берутся той версии, с которой клиент согласился при
        создании заказа, а не действующей на сегодня.
      parameters:
      - description: order id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_billing.OrderEstimate'
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "404":
          description: not_found — заказ не найден или он не ваш
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
      security:
      - BearerAuth: []
      summary: Во сколько обойдётся заказ (клиент)
      tags:
      - client-billing
  /me/orders/{id}/invite:
    post:
      description: |-
        Приглашения уходят первым по приоритету и только на свободные
        места. Откажется или промолчит — подключится следующий.
      parameters:
      - description: order id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_orders.Order'
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "404":
          description: not_found — заказ не ваш
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "409":
          description: wrong_status — приглашения уже отправлены
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
      security:
      - BearerAuth: []
      summary: Отправить приглашения (заказчик)
      tags:
      - client-orders
  /me/orders/{id}/priority:
    put:
      consumes:
      - application/json
      description: |-
        Приглашения уходят по порядку, и передумать после «отправить» —
        нормальная просьба. Переставить можно только тех, кого ещё не
        звали: у приглашённого уже тикает срок ответа. Занятые места
        достаются тем же людям в новом порядке, поэтому перестановка
        не задевает приглашённых, стоящих между ними.
      parameters:
      - description: order id
        in: path
        name: id
        required: true
        type: string
      - description: новый порядок
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_orders.reorderReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_orders.Order'
        "400":
          description: bad_json; bad_id; invalid_input — пустой список; priority_set_mismatch
            — прислан не тот набор людей
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "404":
          description: not_found — заказ не найден или он не ваш
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "409":
          description: priority_locked — заказ уже собран, оплачен или отменён
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
      security:
      - BearerAuth: []
      summary: Переставить приоритет в заказе (клиент)
      tags:
      - client-orders
  /me/orders/availability:
    post:
      consumes:
      - application/json
      description: |-
        Занятость нужна на карточке в выдаче: иначе первым в списке
        окажется тот, кто взять не может, и заказ провисит трое суток
        впустую.

        Отдельной ручкой, а не полем в поиске: поиск живёт в
        OpenSearch и обновляется через outbox, а занятость меняется
        каждый день и от месяца к месяцу. Держать её в индексе значило
        бы переиндексировать каталог на каждую отметку креатора.
        Фильтр по категориям при этом отдельной ручки не требует —
        у /search он уже есть: ?category=blogger,ugc.
      parameters:
      - description: месяцы, на которые смотрим
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_orders.availabilityQueryReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_orders.availabilityQueryResp'
        "400":
          description: bad_json; bad_month — месяц не в формате ГГГГ-ММ; too_many_ids
            — больше 200 человек за раз
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
      security:
      - BearerAuth: []
      summary: Кто из выбранных занят в месяце (заказчик)
      tags:
      - client-orders
  /me/orders/estimate:
    post:
      consumes:
      - application/json
      description: |-
        Сумма для страницы подбора: клиент собирает состав, и она
        пересчитывается на каждое изменение. Оклады известны точно,
        бонус — прогноз по истории выбранных людей, разложенный по
        ступеням тарифа. Кто без истории, тот в среднее не входит и
        посчитан в without_history: считать новичка нулём значит
        занизить смету ровно настолько, насколько подборка новая.
        has_forecast=false означает «бонус неизвестен», а не «ноль».
        Условия берутся действующие — те, с которыми клиент и
        согласится при оформлении.
      parameters:
      - description: состав
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_billing.draftEstimateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_billing.OrderEstimate'
        "400":
          description: bad_json; invalid_input — пустой состав, больше 50 человек,
            ноль роликов или креаторов
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "404":
          description: not_found — прайс ещё не заведён
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
      security:
      - BearerAuth: []
      summary: Сколько будет стоить пакет (заказчик, до создания заказа)
      tags:
      - client-billing
  /me/orders/limit:
    get:
      description: |-
        Первый месяц — один креатор: клиент проверяет формат на
        небольшой сумме, платформа проверяет, что клиент платит и
        адекватно даёт обратную связь. Дальше 2–3.
        Месяц важен: клиент берёт команду с конкретного месяца, и
        к декабрю у него может быть закрыто больше месяцев, чем к
        сентябрю — лимит на сегодня показывал бы не то число, по
        которому потом создастся заказ.
        Клиент видит ограничение ДО подбора, а не при попытке
        добавить второго: запрет посреди работы читается как поломка.
      parameters:
      - description: ГГГГ-ММ, по умолчанию текущий
        in: query
        name: month
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_orders.limitResp'
        "400":
          description: bad_month — месяц не в формате ГГГГ-ММ
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
      security:
      - BearerAuth: []
      summary: Сколько креаторов доступно на месяц (заказчик)
      tags:
      - client-orders
  /me/orders/terms:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_orders.termsResp'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "404":
          description: not_found — версия правил ещё не опубликована
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
      security:
      - BearerAuth: []
      summary: Действующие условия работы (заказчик)
      tags:
      - client-orders
  /me/orders/terms/consent:
    post:
      description: |-
        Согласие фиксируется с конкретной версией: правила меняются —
        старые заказы остаются на своей.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_orders.Terms'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
        "404":
          description: not_found — версия правил ещё не опубликована
          schema:
            $ref: '#/definitions/internal_orders.errorResponse'
      security:
      - BearerAuth: []
      summary: Принять условия работы (заказчик)
      tags:
      - client-orders
  /me/overview:
    get:
      description: |-
        Кросс-проектный срез: просмотры по пяти площадкам и всего,
        счёт по подытоженным периодам и по текущим, сколько уже
        переведено, стоимость тысячи просмотров и разбивка по
        проектам. Стоимость считается из фактических сумм и
        просмотров, а не из ставки тарифа: у проектов бывают
        разные версии условий.
        Подытоженные периоды дают числа из среза, текущие — живые.
        snapshot_approx означает, что часть чисел подтянута:
        поденную статистику к моменту подытога уже удалили.
        Тестовые проекты не учитываются.

        Дашборд считается за СКОЛЬЗЯЩЕЕ окно от сегодня: week — 7 дней,
        month — 30, quarter — 90. Итоги (просмотры, взаимодействия, ER,
        площадки) — за всё время; приросты — окно против предыдущего
        окна такой же длины. Если сравнивать не с чем, поля прироста
        нет вовсе: ноль означал бы «не выросло».
      parameters:
      - description: 'окно дашборда: week | month | quarter (по умолчанию month)'
        enum:
        - week
        - month
        - quarter
        in: query
        name: range
        type: string
