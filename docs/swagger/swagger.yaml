      consumes:
      - application/json
      parameters:
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.TokenPair'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
      summary: Логин по email/телефону и паролю
      tags:
      - auth
  /auth/password-reset/confirm:
    post:
      consumes:
      - application/json
      parameters:
      - description: token + новый пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.passwordResetConfirmReq'
      produces:
      - application/json
      responses:
        "200":
          description: свежая пара tokens — фронт может авто-логинить
          schema:
            $ref: '#/definitions/internal_auth.TokenPair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
        "410":
          description: 'token_invalid: токен неизвестен, использован или просрочен'
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
      summary: Применить новый пароль по токену из письма
      tags:
      - auth
  /auth/password-reset/request:
    post:
      consumes:
      - application/json
      description: |-
        Всегда 204 (anti-enumeration). Если email зарегистрирован,
        на него уйдёт письмо со ссылкой DOMAIN/auth/reset?token=...
      parameters:
      - description: email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.passwordResetRequestReq'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
      summary: Запросить ссылку сброса пароля
      tags:
      - auth
  /auth/redeem_invite/{token}:
    post:
      parameters:
      - description: raw invite token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_admin.redeemResp'
        "410":
          description: invite_invalid
          schema:
            $ref: '#/definitions/internal_admin.errorResponse'
      summary: Обменять magic-link на JWT (публичный)
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.refreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.TokenPair'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
      summary: Обмен refresh-токена на новую пару
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: |-
        При невалидном вводе или занятом email отвечает 400 invalid_input
        (разные причины не различаются — anti-enumeration).
      parameters:
      - description: регистрационные данные
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.registerReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_auth.registerResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /auth/resend-verification:
    post:
      description: Гасит прошлые токены и шлёт новое письмо. Cooldown 60s по user_id.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
        "429":
          description: resend_cooldown
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
      security:
      - BearerAuth: []
      summary: Перевыслать письмо подтверждения email
      tags:
      - auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      parameters:
      - description: token из ссылки в письме
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.verifyEmailReq'
      produces:
      - application/json
      responses:
        "200":
          description: новая пара токенов с актуальным email_verified
          schema:
            $ref: '#/definitions/internal_auth.TokenPair'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
        "410":
          description: 'token_invalid: токен неизвестен, использован, просрочен или
            email сменился'
          schema:
            $ref: '#/definitions/internal_auth.errorResponse'
      summary: Подтвердить email по токену из письма
      tags:
      - auth
  /categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_catalog.CategoriesResponse'
      summary: Список категорий специалистов
      tags:
      - catalog
  /categories/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_search.categoryStatsResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_search.errorResponse'
      summary: Кол-во специалистов в каждой категории
      tags:
      - search
  /clarify:
    post:
      consumes:
      - application/json
      description: LLM возвращает следующий вопрос или конечный поисковый запрос (done=true).
      parameters:
      - description: история диалога
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_clarify.request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_clarify.Result'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_clarify.errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_clarify.errorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_clarify.errorResponse'
      summary: Уточняющий диалог по брифу
      tags:
      - llm
  /feed:
    get:
      description: Возвращает специалистов и связанные видео из портфолио. Поддерживает
        фильтры и cursor-пагинацию.
      parameters:
      - description: search text (игнорируется если задан ids)
        in: query
        name: q
        type: string
      - collectionFormat: csv
        description: category codes (multi, csv; игнорируется если задан ids)
        in: query
        items:
          type: string
        name: category
        type: array
      - collectionFormat: csv
        description: skill slugs (multi, csv; игнорируется если задан ids)
        in: query
        items:
          type: string
        name: skill
        type: array
      - description: city (игнорируется если задан ids)
        in: query
        name: city
        type: string
      - collectionFormat: csv
        description: 'user_id (csv, до 100) — жёсткий фильтр: показывать видео только
          этих спецов'
        in: query
        items:
          type: string
        name: ids
        type: array
      - description: видео на специалиста
        in: query
        name: per_specialist
        type: integer
      - description: cursor токен
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_feed.Result'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_feed.feedError'
      summary: Лента «портфолио по категориям»
      tags:
      - feed
  /leads:
    post:
      consumes:
      - application/json
      description: Менеджер/клиент создаёт лид и выбирает специалистов-получателей.
        В ответе — id и контакты выбранных спецов (видны только создателю).
      parameters:
      - description: lead payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_leads.createReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_leads.CreateResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_leads.errorResponse'
        "403":
          description: email_unverified — для авторизованного клиента email должен
            быть подтверждён
          schema:
            $ref: '#/definitions/internal_leads.errorResponse'
      security:
      - BearerAuth: []
      summary: Создать заявку (lead)
      tags:
      - leads
  /manager/projects:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.managerListResp'
      security:
      - BearerAuth: []
      summary: Мои проекты (assigned_to=me) — для канбана
      tags:
      - manager-projects
    post:
      consumes:
      - application/json
      description: |-
        Создаёт проект с указанным pipeline_id. Если client_user_id
        не передан, требуется client_name+client_contact (no-account
        клиент). assigned_to_user_id принудительно ставится в текущего
        менеджера — менеджер не может вешать чужой проект на коллегу.
      parameters:
      - description: project
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_projects.managerCreateProjectReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_projects.Project'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: 'Менеджер: создать проект вручную (включая клиента без аккаунта)'
      tags:
      - manager-projects
  /manager/projects/{id}:
    get:
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.ProjectFullView'
      security:
      - BearerAuth: []
      summary: Полный вид моего проекта (все стадии и шаги)
      tags:
      - manager-projects
    patch:
      consumes:
      - application/json
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: patch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_projects.ManagerPatchInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.Project'
        "409":
          description: stale_updated_at
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Inline-редактирование title/budget/notes
      tags:
      - manager-projects
  /manager/projects/{id}/advance_stage:
    post:
      description: |-
        Канбан-drag: завершает оставшиеся team-шаги текущей стадии,
        активирует первый шаг следующей. 409 если есть незавершённый
        client-шаг.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.Project'
        "409":
          description: stage_blocked | last_stage
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Продвинуть проект на следующую стадию
      tags:
      - manager-projects
  /manager/projects/{id}/approve_specialist:
    post:
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.approveResp'
        "400":
          description: no_proposed_specialist
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Подтвердить выбранного клиентом исполнителя
      tags:
      - manager-projects
  /manager/projects/{id}/assign_specialist:
    post:
      consumes:
      - application/json
      description: |-
        Используется для проектов, заведённых менеджером без брифа,
        либо после reject_specialist'a — выбрать другого. Валидирует
        что target — kind='specialist' и активен.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: specialist_user_id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_projects.assignSpecReq'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Назначить специалиста на проект (по UUID)
      tags:
      - manager-projects
  /manager/projects/{id}/claim:
    post:
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "409":
          description: already_claimed
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Взять проект на себя
      tags:
      - manager-projects
  /manager/projects/{id}/comments:
    get:
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.commentsResp'
      security:
      - BearerAuth: []
      summary: Комментарии проекта (менеджер)
      tags:
      - manager-projects
    post:
      consumes:
      - application/json
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_projects.commentReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_projects.Comment'
      security:
      - BearerAuth: []
      summary: Добавить комментарий (менеджер)
      tags:
      - manager-projects
  /manager/projects/{id}/events:
    get:
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: default 50, max 200
        in: query
        name: limit
        type: integer
      - description: default 0
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.eventsResp'
      security:
      - BearerAuth: []
      summary: Лента активности проекта (менеджер)
      tags:
      - manager-projects
  /manager/projects/{id}/move_stage:
