      - client-profile
    patch:
      consumes:
      - application/json
      parameters:
      - description: patch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_profiles.ClientProfilePatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_profiles.ClientProfile'
      security:
      - BearerAuth: []
      summary: Сохранить контакты клиента
      tags:
      - client-profile
  /me/leads/{id}/recipient:
    patch:
      consumes:
      - application/json
      parameters:
      - description: lead id
        in: path
        name: id
        required: true
        type: string
      - description: статус
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_leads.recipientReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_leads.recipientStatusResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_leads.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_leads.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_leads.errorResponse'
        "409":
