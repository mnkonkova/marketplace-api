        Срез просмотров удаляется, период снова считается на лету.
        Действие пишется в журнал админских действий: переоткрытие
        переписывает историю расчёта, и след обязателен.
        Идемпотентно: период, который и так идёт, ручка оставляет как есть.

        ПОСЛЕДСТВИЕ: у следующего периода вход (carry_in_*) посчитан
        от выхода этого, и после переоткрытия он недостоверен —
        как и вся цепочка дальше. Пока арифметики переноса нет,
        это предупреждение; в ответе видно, сколько подытоженных
        периодов идёт следом.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: номер периода, по умолчанию текущий
        in: query
        name: period
        type: integer
      - description: причина
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_billing.unlockPeriodReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_billing.periodResp'
        "400":
          description: bad_id; bad_period
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "404":
          description: not_found — у проекта ещё нет периодов
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
      security:
      - BearerAuth: []
      summary: Вернуть подытоженный период в работу (админ)
      tags:
      - admin-billing
  /admin/projects/{id}/change_funnel:
    post:
      consumes:
      - application/json
      description: Удаляет project_stages/project_steps текущего проекта и инстанциирует
        их из новой воронки. revisions_used обнуляется, started_at пересчитывается.
        Только для status=active.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: new pipeline_id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_projects.changeFunnelReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.Project'
        "400":
          description: bad_id | bad_pipeline_id | invalid_transition
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "404":
          description: no_project | no_pipeline
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: 'Админ: сменить воронку проекта (сбросить прогресс)'
      tags:
      - admin-projects
  /admin/projects/{id}/comments:
    get:
      description: Все ветки сразу; thread сужает до одной.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: client | creator | internal
