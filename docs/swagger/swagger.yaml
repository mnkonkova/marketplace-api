      description: |-
        Сообщение уходит в клиентскую ветку. Креаторы её не видят.
        body_format=html — разметка чистится на сервере: остаются
        жирный, курсив, списки, ссылки и упоминания, остальное
        выбрасывается. Упомянуть можно только участника ветки.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_projects.commentReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_projects.Comment'
        "400":
          description: bad_json; bad_id; empty_comment — пустое сообщение; invalid_input
            — превышена длина или неизвестный body_format
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "404":
          description: not_found — проект не найден или чужой
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Клиент пишет в переписку по своему проекту
      tags:
      - client-projects
  /me/projects/{id}/comments/participants:
    get:
      description: |-
        Список для выпадашки @. Он же — множество, по которому
        упоминания проверяются на записи.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.participantsResp'
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "404":
          description: not_found — проект не найден или чужой
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Кого можно упомянуть в переписке (клиент)
      tags:
      - client-projects
  /me/projects/{id}/funnel:
    get:
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.ProjectClientView'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Воронка моего проекта (стадии + видимые шаги)
      tags:
      - client-projects
  /me/projects/{id}/materials:
    get:
      description: |-
        Только помеченные как клиентские. Обучение и бренд-гайд для
        креаторов заказчику не показываются.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_publications.materialsResp'
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "404":
          description: not_found — проект не найден или он не ваш
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
      security:
      - BearerAuth: []
      summary: Материалы проекта (заказчик)
      tags:
      - client-publications
  /me/projects/{id}/notifications:
    get:
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_publications.NotificationPrefs'
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "404":
          description: not_found — проект не ваш
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
      security:
      - BearerAuth: []
      summary: Настройки уведомлений (заказчик)
      tags:
      - client-publications
    put:
      consumes:
      - application/json
      description: |-
        Незаданные поля не меняются. views_threshold = 0 или null
        означает «не уведомлять о просмотрах».
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: настройки уведомлений
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_publications.prefsReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_publications.NotificationPrefs'
        "400":
          description: bad_json; bad_id
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "404":
          description: not_found — проект не ваш
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
      security:
      - BearerAuth: []
      summary: Изменить настройки уведомлений (заказчик)
      tags:
      - client-publications
  /me/projects/{id}/report:
    get:
      description: |-
        Те же цифры, что у менеджера, без внутренней кухни.
        Доступен, только если у проекта включён показ статистики.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_publications.Report'
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "404":
          description: not_found — проект не ваш либо показ статистики отключён (ответ
            одинаковый намеренно)
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
      security:
      - BearerAuth: []
      summary: Отчёт по проекту (заказчик)
      tags:
      - client-publications
  /me/projects/{id}/report.csv:
    get:
      description: |-
        Та же таблица, что у менеджера. Доступна по тому же правилу,
        что и сам отчёт: при выключенном показе статистики — 404,
        как и «не ваш проект».
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV
          schema:
            type: string
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "404":
          description: not_found — проект не ваш или показ статистики выключен
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
      security:
      - BearerAuth: []
      summary: Выгрузка отчёта в CSV (заказчик)
      tags:
      - client-publications
  /me/projects/{id}/steps/{step_id}/submit_review:
    post:
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: step id (is_review=true)
        in: path
        name: step_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.Step'
      security:
      - BearerAuth: []
      summary: Закрыть review-шаг (после оставления отзыва)
      tags:
      - client-projects
  /me/projects/{id}/videos:
    get:
      description: |-
        Ролик появляется в ленте, когда его можно посмотреть, — то есть
        когда креатор сдал ссылки, а не когда стоит дата в плане.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_publications.clientFeedResp'
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "401":
          description: no_user
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
        "404":
          description: not_found — проект не ваш
          schema:
            $ref: '#/definitions/internal_publications.errorResponse'
      security:
      - BearerAuth: []
      summary: Вышедшие ролики проекта (заказчик)
      tags:
      - client-publications
  /me/specialist/general-projects:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.generalListResp'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Общие проекты, где я исполнитель
      tags:
      - specialist-projects
  /me/specialist/general-projects/{id}:
    get:
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.GeneralProject'
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "404":
          description: not_found — проект не найден или вы не его исполнитель
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Карточка общего проекта (исполнитель)
      tags:
      - specialist-projects
  /me/specialist/general-projects/{id}/deliver:
    post:
      consumes:
      - application/json
      description: |-
        Материалы — ссылки на результат, до 20 штук. Пока клиент не
        ответил, сдать второй раз нельзя.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_projects.generalDeliverReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_projects.Delivery'
        "400":
          description: bad_json; bad_id; invalid_input — нет ни ссылки, ни комментария;
            больше 20 материалов; ссылка не http(s); неизвестный kind материала
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "404":
          description: not_found — проект не найден или вы не его исполнитель
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
        "409":
          description: delivery_pending — предыдущая сдача ещё не разобрана; project_closed
            — проект принят или отменён
          schema:
            $ref: '#/definitions/internal_projects.errorResponse'
      security:
      - BearerAuth: []
      summary: Сдать работу (исполнитель)
      tags:
      - specialist-projects
  /me/specialist/projects:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.managerListResp'
      security:
      - BearerAuth: []
      summary: Назначенные мне проекты (специалист)
      tags:
      - specialist-projects
  /me/specialist/projects/{id}/funnel:
    get:
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_projects.ProjectFullView'
      security:
      - BearerAuth: []
      summary: Воронка моего проекта (специалист, read-only)
      tags:
      - specialist-projects
  /me/uploads/image:
    post:
      consumes:
      - application/json
      parameters:
      - description: filename/size
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_profiles.ImageUploadURLInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_profiles.PortfolioUploadURL'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_profiles.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_profiles.errorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_profiles.errorResponse'
      security:
      - BearerAuth: []
      summary: Presigned PUT URL для аплоада картинки (аватар / превью)
      tags:
      - portfolio
  /productions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_productions.listResp'
      summary: Список продакшенов (для выбора в профиле спеца)
      tags:
      - productions
  /reviews:
    post:
      consumes:
      - application/json
      description: Оставляет отзыв на специалиста. Если указан lead_id, то клиент
        должен быть автором лида, а target — принятым получателем.
      parameters:
      - description: review payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_reviews.createReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_reviews.Review'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
      security:
      - BearerAuth: []
      summary: Создать отзыв
      tags:
      - reviews
  /reviews/{id}:
    delete:
      description: Удаляет отзыв. Только автор отзыва.
      parameters:
      - description: review id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: no content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
      security:
      - BearerAuth: []
      summary: Удалить отзыв
      tags:
      - reviews
    patch:
      consumes:
      - application/json
      description: Изменяет рейтинг и/или текст отзыва. Только автор отзыва.
      parameters:
      - description: review id
        in: path
        name: id
        required: true
        type: string
      - description: patch payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_reviews.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_reviews.Review'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
      security:
      - BearerAuth: []
      summary: Изменить отзыв
      tags:
      - reviews
  /search:
    get:
      description: Возвращает hits + relaxed/similar если soft-фильтры не сошлись.
      parameters:
      - description: search text
        in: query
        name: q
        type: string
      - collectionFormat: csv
        description: category codes (multi)
        in: query
        items:
          type: string
        name: category
        type: array
      - collectionFormat: csv
        description: skill slugs (multi)
        in: query
        items:
          type: string
        name: skill
        type: array
      - description: city
        in: query
        name: city
        type: string
      - description: rate min
        in: query
        name: rate_min
        type: integer
      - description: rate max
        in: query
        name: rate_max
        type: integer
      - description: limit
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_search.Result'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_search.errorResponse'
      summary: Поиск специалистов
      tags:
      - search
  /search/summarize:
    post:
      consumes:
      - application/json
      description: По текстовому запросу/фильтрам поиска возвращает подобранную LLM-выдачу.
      parameters:
      - description: поисковые параметры
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_summarize.request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_summarize.Result'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_summarize.errorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_summarize.errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_summarize.errorResponse'
      summary: LLM-подбор «топ-N специалистов»
      tags:
      - llm
  /skills:
    get:
      parameters:
      - description: tool|platform|genre|skill
        in: query
        name: kind
        type: string
      - collectionFormat: csv
        description: Коды категорий из /categories (можно несколько или через запятую)
          — отфильтровать навыки, релевантные категории (см. skill_categories). Платформы
          при фильтре по категории не возвращаются.
        in: query
        items:
          type: string
        name: category
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_catalog.SkillsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_catalog.errorResponse'
      summary: Список навыков
      tags:
      - catalog
  /specialists/{handle}:
    get:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_profiles.PublicProfile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_profiles.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_profiles.errorResponse'
      summary: Публичный профиль специалиста
      tags:
      - profile
  /specialists/{id}/reviews:
    get:
      description: Листит отзывы, отсортированные по дате убывания.
      parameters:
      - description: specialist user id
        in: path
        name: id
        required: true
        type: string
      - description: default 20, max 100
        in: query
        name: limit
        type: integer
      - description: default 0
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_reviews.listResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_reviews.errResponse'
      summary: Отзывы на специалиста (пагинация)
      tags:
      - reviews
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
