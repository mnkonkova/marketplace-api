      tags:
      - admin-projects
  /admin/projects/{id}/move_stage:
    post:
      consumes:
      - application/json
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: target_stage_id
        in: body
        name: body
