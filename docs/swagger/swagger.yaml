  /admin/projects/{id}/move_step:
    post:
      consumes:
      - application/json
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: target_step_id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_projects.moveStepReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
