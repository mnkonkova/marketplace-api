  /manager/projects/{id}/billing:
    get:
      description: |-
        Условия, платежи заказчика, начисления креаторам за месяц,
        UTM-метки и итог периода — одним ответом: по частям это
        пять запросов на один экран. Все суммы в копейках.
        В каждой строке начисления две суммы: total — счёт
        заказчику за этого креатора, payout_total — выплата
        самому креатору. В totals они сведены: total, payouts и
        margin (что остаётся платформе).
        Тариф ступенчатый: до порога на ролик — полная ставка,
        свыше — пониженная.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: номер периода проекта, по умолчанию текущий
        in: query
        name: period
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_billing.ProjectBilling'
        "400":
          description: bad_id; bad_period — номер периода не целое число
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "404":
          description: not_found — проект не найден или ведёт другой менеджер
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
      security:
      - BearerAuth: []
      summary: Деньги проекта (менеджер)
      tags:
      - manager-billing
    put:
      consumes:
      - application/json
      description: |-
        Условия — снимок, а не ссылка на действующий прайс: правка
        прайса не переписывает историю уже идущего проекта.
        У тарифа две стороны: что платит клиент и что получает
        креатор. Креаторские ставки null означают «столько же» —
        тогда выплата равна счёту и маржи у платформы нет.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      - description: ставки в копейках
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_billing.termsReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_billing.Terms'
        "400":
          description: bad_json; bad_id; invalid_input — отрицательная ставка
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "404":
          description: not_found — проект не найден или ведёт другой менеджер
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
      security:
      - BearerAuth: []
      summary: Задать условия проекта (менеджер)
      tags:
      - manager-billing
  /manager/projects/{id}/billing/adopt:
    post:
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_billing.Terms'
        "400":
          description: bad_id
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "401":
          description: no_user — сессия истекла
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
        "404":
          description: not_found — проект не найден, или прайс ещё не заведён
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
      security:
      - BearerAuth: []
      summary: Взять условия из действующего прайса (менеджер)
      tags:
      - manager-billing
  /manager/projects/{id}/billing/periods:
    get:
      description: |-
        Периоды катятся от даты первой публикации: вышел первый
        ролик 15-го — периоды идут с 15-го по 14-е. Пока не вышло
        ничего, периодов нет — и это не ошибка.
      parameters:
      - description: project id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_billing.periodsResp'
        "404":
          description: not_found — проект не найден или ведёт другой менеджер
          schema:
            $ref: '#/definitions/internal_billing.errorResponse'
      security:
      - BearerAuth: []
      summary: Периоды проекта (менеджер)
      tags:
      - manager-billing
