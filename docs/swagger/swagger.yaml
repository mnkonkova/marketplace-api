      - description: publication id
        in: path
        name: pub_id
        required: true
        type: string
      - description: ссылки на выкладку
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_publications.submitReq'
      produces:
      - application/json
      responses:
