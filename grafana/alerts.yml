# Prometheus alert rules для marketpclce. Импортируется в Grafana Cloud:
#   1. Grafana → Alerts & IRM → Alert rules → New rule → Mimir managed alerts.
#   2. Импорт из файла: paste содержимое (формат — стандартный Prometheus
#      rule group). Group "marketpclce" станет видимым в UI.
#
# Для локального деплоя через Alloy: добавь в alloy/config.alloy компонент
# `mimir.rules.local` или копируй файл в /etc/alloy/rules.yml.
#
# Соглашения по labels:
#   severity = page | warn  (page = разбудить, warn = разобраться днём)
#   team     = backend
#
# Все алерты "for"-длительности подобраны так, чтобы не реагировать на
# одиночные шипы (обычные деплои и редкие сбои). На проде поднять/опустить
# можно прямо здесь — Mimir перечитает rules при следующем sync.

groups:
  # ── HTTP API ────────────────────────────────────────────────────────
  - name: marketpclce-http
    interval: 1m
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="marketpclce-api",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="marketpclce-api"}[5m]))
          ) > 0.05
        for: 5m
        labels: { severity: page, team: backend }
        annotations:
          summary: "API 5xx error rate > 5% (5m)"
          description: "Текущая доля 5xx: {{ $value | humanizePercentage }}. Загляни в 'Errors by route' на дашборде marketpclce-http."

      - alert: APIp95LatencyHigh
        # Exclude LLM-роуты: они ожидаемо 1-5s (anthropic/deepseek думает),
        # под них есть отдельный LLMHandlerP95High с порогом 20s. Иначе
        # общий p95 ловит false-positive каждый раз когда юзер публикует
        # профиль / запускает clarify / summarize.
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="marketpclce-api",route!~".*/(search/summarize|clarify|me/profile/check|me/profile/publish)"}[5m]))
          ) > 2
        for: 10m
        labels: { severity: warn, team: backend }
        annotations:
          summary: "API p95 > 2s (без LLM)"
          description: "p95 = {{ $value | humanizeDuration }}. LLM-роуты исключены. Проверь медленные route'ы и upstream'ы (OS, PG, S3)."

  # ── Кабинеты по ролям (CRM) ─────────────────────────────────────────
  - name: marketpclce-crm-cabinets
    interval: 1m
    rules:
      - alert: ManagerCabinet5xxSpike
        expr: |
          sum(rate(http_requests_total{job="marketpclce-api",route=~".*/manager/.*",status=~"5.."}[5m])) > 0.1
        for: 5m
        labels: { severity: page, team: backend }
        annotations:
          summary: "Manager cabinet 5xx > 0.1 rps"
          description: "Менеджерские endpoints начали сыпаться. Посмотри 'CRM cabinets by role / 5xx error rate'."

      - alert: AdminCabinet5xxSpike
        expr: |
          sum(rate(http_requests_total{job="marketpclce-api",route=~".*/admin/.*",status=~"5.."}[5m])) > 0.05
        for: 5m
        labels: { severity: page, team: backend }
        annotations:
          summary: "Admin cabinet 5xx > 0.05 rps"
          description: "Админка падает — нужна экстренная починка."

      - alert: ClientCabinet5xxSpike
        expr: |
          sum(rate(http_requests_total{job="marketpclce-api",route=~".*/me/projects.*|.*/me/leads.*",status=~"5.."}[5m])) > 0.5
        for: 5m
        labels: { severity: warn, team: backend }
        annotations:
          summary: "Client cabinet 5xx > 0.5 rps"
          description: "Клиентский кабинет лагает. Это видно пользователям — приоритет высокий."

  # ── Outbox / async pipeline ────────────────────────────────────────
  - name: marketpclce-outbox
    interval: 1m
    rules:
      - alert: OutboxPendingBacklog
        expr: outbox_pending > 1000
        for: 10m
        labels: { severity: warn, team: backend }
        annotations:
          summary: "Outbox pending > 1000 events (sustained)"
          description: "Текущий backlog: {{ $value }}. n8n или один из handler'ов отстаёт."

      - alert: OutboxLeaseLeak
        # P3: pending растёт, но lockable = 0 длительное время → события
        # "заперты" в lease, handler крашится между Phase 2 и Phase 3.
        # При нормальной работе lockable почти всегда > 0 (новые events
        # appear ≥ 1/min). Lease истекает через 10 мин, так что for=15m
        # отсекает обычные пиковые ситуации.
        expr: outbox_pending > 50 and outbox_lockable == 0
        for: 15m
        labels: { severity: page, team: backend }
        annotations:
          summary: "Outbox lease leak — pending > 50, lockable == 0 for 15m"
          description: "События застряли в lease (10 мин на каждый), но lockable=0 >15м. Скорее всего воркер крашится в Phase 2 (handler/network) и не доводит до Phase 3 mark-tx. Проверь worker логи."

      - alert: OutboxDeadLetterBacklog
        expr: outbox_dead > 0
        for: 5m
        labels: { severity: warn, team: backend }
        annotations:
          summary: "Outbox has dead-lettered entries"
          description: "{{ $value }} событий в DLQ. Это требует ручного разбора: либо payload bug (P4 permanent), либо n8n был долго недоступен. Запрос: SELECT aggregate, event_type, last_error FROM outbox WHERE dead_at IS NOT NULL ORDER BY dead_at DESC LIMIT 20;"

      - alert: OutboxDeadLetterRising
        # P4: 4xx → ErrPermanent → сразу DLQ. Один битый payload — окей,
        # но >5/час значит чья-то интеграция сломалась системно.
        expr: sum(increase(outbox_dead_total[1h])) > 5
        for: 5m
        labels: { severity: page, team: backend }
        annotations:
          summary: "Outbox dead-letter rate > 5/hour"
          description: "Темп DLQ: {{ $value }}/час. Похоже на системную поломку (новый event_type с неверным payload или 4xx от n8n workflow)."

      - alert: OutboxHandlerErrorSpike
        expr: |
          sum by (aggregate, event_type) (rate(outbox_handler_errors_total[5m])) > 0.5
        for: 5m
        labels: { severity: warn, team: backend }
        annotations:
          summary: "Outbox handler error rate > 0.5 rps for {{ $labels.aggregate }}/{{ $labels.event_type }}"
          description: "Конкретный handler стабильно валится. Если это webhook → проверь n8n. Если specialist/email — проверь OS/Unisender."

  # ── LLM endpoints ──────────────────────────────────────────────────
  - name: marketpclce-llm
    interval: 1m
    rules:
      - alert: LLMHandlerP95High
        # P5: deadline 25-30s. p95 > 20s = провайдер тяжело отвечает,
        # пользователи видят таймауты на грани.
        expr: |
          histogram_quantile(0.95,
            sum by (le, route) (rate(http_request_duration_seconds_bucket{job="marketpclce-api",route=~".*/(search/summarize|clarify|me/profile/check)"}[5m]))
          ) > 20
        for: 10m
        labels: { severity: warn, team: backend }
        annotations:
          summary: "LLM endpoint p95 > 20s for {{ $labels.route }}"
          description: "Claude/Deepseek тормозит. Проверь статусную страницу провайдера. Если устойчиво — возможно переключить effort с medium на low."

      - alert: LLM5xxSpike
        # 502 = LLM-провайдер ошибся, 503 = fail-CLOSED (P8, Redis лёг).
        expr: |
          sum by (route) (rate(http_requests_total{job="marketpclce-api",route=~".*/(search/summarize|clarify|me/profile/check)",status=~"5.."}[5m])) > 0.1
        for: 5m
        labels: { severity: page, team: backend }
        annotations:
          summary: "LLM 5xx > 0.1 rps for {{ $labels.route }}"
          description: "LLM endpoint падает. 502 = провайдер; 503 = Redis лежит (см. RateLimitFailClosed)."

  # ── Rate limit / brute-force ──────────────────────────────────────
  - name: marketpclce-ratelimit
    interval: 1m
    rules:
      - alert: RateLimitFailClosedActive
        # P8: 503 на expensive route — Redis нет, защита включилась.
        # Это нормально работает (защищает биллинг), но юзеры в полной
        # темноте, и надо чинить Redis срочно.
        expr: |
          sum(rate(http_requests_total{job="marketpclce-api",status="503",route=~".*/(search/summarize|clarify|leads|auth/.*)"}[5m])) > 0
        for: 2m
        labels: { severity: page, team: backend }
        annotations:
          summary: "Rate limit fail-CLOSED active (P8) — Redis is likely down"
          description: "Юзеры получают 503 на дорогих endpoint'ах. Redis недоступен → подними его, проверь network."

      - alert: AuthBruteForceLikely
        # 429 на /auth/* = кто-то долбит логин/регистрацию.
        expr: |
          sum(rate(http_requests_total{job="marketpclce-api",route=~".*/auth/.*",status="429"}[5m])) > 1
        for: 5m
        labels: { severity: warn, team: backend }
        annotations:
          summary: "Auth 429 rate > 1 rps (brute-force?)"
          description: "Кто-то перебирает auth-endpoint'ы. Глянь access-логи по IP, при необходимости — IP-бан в Caddy."

  # ── OpenSearch backend ────────────────────────────────────────────
  - name: marketpclce-opensearch
    interval: 1m
    rules:
      - alert: ESLatencyHigh
        # bulk и search — критичные операции. Search > 2s ломает /search UX.
        expr: |
          histogram_quantile(0.95,
            sum by (le, op) (rate(es_request_duration_seconds_bucket{op=~"search|bulk"}[5m]))
          ) > 2
        for: 10m
        labels: { severity: warn, team: backend }
        annotations:
          summary: "OpenSearch p95 > 2s for {{ $labels.op }}"
          description: "OS тормозит. Если bulk — outbox-handler застревает; если search — каталог лагает у юзеров. Проверь JVM heap / disk на OS-инстансе."

      - alert: ESErrorRateHigh
        # delete_doc и delete_by_query исключены: их 404 (документа нет —
        # ничего страшного, наш end-state достигнут) и 409 (external_gte
        # version_conflict — конкурентный writer уже записал более свежую
        # версию, наша операция была бы регрессом) клиент проглатывает как
        # success в DeleteDocVer (см. internal/platform/es/client.go).
        # НО метрика es_requests_total{status_class="4xx"} инкрементируется
        # в defer ДО swallow, поэтому raw-счётчик показывает «ошибки»
        # которые семантически не ошибки.
        #
        # Реальные delete-проблемы видны через outbox_handler_errors_total
        # (alert OutboxHandlerErrorSpike выше) — если delete'ы массово
        # реально валятся (5xx, network, неподдерживаемый 4xx), handler
        # вернёт ошибку и outbox это засчитает.
        expr: |
          (
            sum by (op) (rate(es_requests_total{op!~"delete_doc|delete_by_query",status_class!="2xx"}[5m]))
            /
            clamp_min(sum by (op) (rate(es_requests_total{op!~"delete_doc|delete_by_query"}[5m])), 0.01)
          ) > 0.05
        for: 5m
        labels: { severity: page, team: backend }
        annotations:
          summary: "OpenSearch error rate > 5% for {{ $labels.op }}"
          description: "Каждый 20-й запрос валится. Mapping mismatch (4xx), кластер падает (5xx) или сеть рвётся (status_class=error)."

      - alert: ESDown
        # Уверенная проверка через Ping в /readyz: но если она долго не
        # работает, http_requests_total на /readyz уйдёт в 5xx. Альтернатива
        # — отсутствие es_requests_total за 5 минут (никто не ходит в OS).
        # Считаем: ноль успешных search-запросов за 10 минут = подозрение.
        expr: |
          sum(rate(es_requests_total{op="search",status_class="2xx"}[5m])) == 0
          and on() sum(rate(es_requests_total{op="search"}[5m])) > 0
        for: 5m
        labels: { severity: page, team: backend }
        annotations:
          summary: "OpenSearch: no successful search responses for 5m+"
          description: "Search-запросы идут, но 0 успешных. Скорее всего OS-кластер недоступен."

  # ── Video transcoding pipeline ────────────────────────────────────
  - name: marketpclce-transcode
    interval: 1m
    rules:
      - alert: TranscodeQueueBacklog
        # queue_depth > 50 устойчиво = воркер не успевает обрабатывать
        # новые видео. 30m выбрано чтобы не алертить на нормальные пики
        # после backfill'a.
        expr: transcode_queue_depth > 50
        for: 30m
        labels: { severity: warn, team: backend }
        annotations:
          summary: "Transcode queue depth > 50 (sustained)"
          description: "Текущая очередь: {{ $value }}. Либо ffmpeg отвалился (логи воркера 'transcode disabled'), либо нагрузка превышает 1 CPU. Поднять параллельность или vCPU."

      - alert: TranscodeErrorSpike
        # > 0.5 ошибок/сек в любом reason = массовая поломка. Часто
        # одна из двух: ffmpeg крашится на новом кодеке / S3 не отвечает.
        expr: |
          sum by (reason) (rate(transcode_errors_total[5m])) > 0.5
        for: 5m
        labels: { severity: page, team: backend }
        annotations:
          summary: "Transcode error spike: reason={{ $labels.reason }}"
          description: "{{ $value }} ошибок/сек. reason=permanent → битые payload'ы; network → S3 лагает; timeout → ffmpeg не успевает (CPU перегружен или видео слишком большое); other → смотри логи воркера."

      - alert: TranscodeDurationP95High
        # p95 > 60s = pipeline тяжелит outbox-lease. Lease у нас 10 минут,
        # но 60s+ на превью = что-то не так (нормально 10-30s на 480p).
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(transcode_duration_seconds_bucket[10m]))) > 60
        for: 15m
        labels: { severity: warn, team: backend }
        annotations:
          summary: "Transcode p95 duration > 60s"
          description: "p95 = {{ $value | humanizeDuration }}. CPU перегружен или ffmpeg застрял на ретре. Глянь node CPU + transcode логи."

      - alert: TranscodeNoSuccessButHasQueue
        # Очередь не пустая, но за последние 10 мин нет ни одного success.
        # Это либо ffmpeg/S3 лежит, либо worker крашится в Phase 2 lease.
        # Дополняет OutboxLeaseLeak с другой стороны.
        expr: |
          transcode_queue_depth > 0
          and sum(rate(transcode_success_total[10m])) == 0
        for: 10m
        labels: { severity: page, team: backend }
        annotations:
          summary: "Transcode: queue > 0 but no successes for 10m"
          description: "Очередь {{ with query \"transcode_queue_depth\" }}{{ . | first | value }}{{ end }} ждёт, но pipeline стоит. Проверь worker логи + статус последних строк в portfolio_items (preview_status='processing' с старым updated_at)."

  # ── n8n availability ────────────────────────────────────────────────
  # n8n shipping в проде делает email + Telegram. Down = ни verify-email,
  # ни нотификаций. Алерт жёсткий (page) — без писем юзеры не регистрируются.
  - name: marketpclce-n8n
    interval: 1m
    rules:
      - alert: N8nDown
        expr: up{job="marketpclce-n8n"} == 0
        for: 3m
        labels: { severity: page, team: backend }
        annotations:
          summary: "n8n container не отвечает на /healthz 3+ минуты"
          description: "Проверь `docker ps | grep n8n` и `docker logs marketplace-api-n8n-1`. Без n8n не уходят email-верификации и Telegram-нотификации (worker квитирует events как obs, но шаблоны не рендерятся)."

      - alert: N8nWebhookFailureRate
        expr: |
          sum(rate(outbox_handler_errors_total{aggregate=~"project|user|support"}[10m]))
          /
          (sum(rate(outbox_handler_processed_total{aggregate=~"project|user|support"}[10m])) > 0)
          > 0.1
        for: 10m
        labels: { severity: warn, team: backend }
        annotations:
          summary: "n8n webhook delivery > 10% failures (10m)"
          description: "Worker не может доставить events в n8n (HTTP не-2xx). Чаще всего — n8n workflow деактивирован или credential отвалился."

  # ── Бизнес-метрики (sanity) ─────────────────────────────────────────
  # Алерты не на «мало брифов = бизнес умер», а на технические аномалии:
  # если БЫЛИ заявки и они вдруг пропали — наверняка форма брифа сломалась.
  - name: marketpclce-business
    interval: 5m
    rules:
      - alert: LeadsStopped
        # leads_created_24h резко обнулилось (раньше >5 в день, сейчас 0)
        expr: |
          leads_created_24h == 0
          and
          avg_over_time(leads_created_24h[7d]) > 5
        for: 3h
        labels: { severity: warn, team: backend }
        annotations:
          summary: "Лиды перестали приходить — 0 за 24h при норме > 5"
          description: "POST /leads не доходит до БД ИЛИ форма брифа сломалась. Чек: HTTP-дашборд `RPS by route` для /leads, error rate на POST."

      - alert: LeadToProjectConversionLow
        # Lead'ы есть, но проектов из них не создаётся (StartFromLead падает).
        # Норма ≈1:1 (каждый lead с logged-in клиентом → project).
        expr: |
          (projects_created_24h / leads_created_24h) < 0.3
          and
          leads_created_24h > 10
        for: 3h
        labels: { severity: warn, team: backend }
        annotations:
          summary: "Конверсия lead→project упала ниже 30% (норма ~100%)"
          description: "StartFromLead падает в API. Глянь api.log на `leads: StartFromLead failed`. Возможно default-pipeline пропал или enrichProjectPayload ломает tx."

  # ── Host & API basic (ручные алерты, default-1m в Grafana UI) ──────
  # Простые boolean-проверки на critical-уровень: API не отвечает,
  # диск кончается, OOM близко. Эти алерты выживают даже если
  # http_requests_total отвалится (используют up{} вместо метрик
  # бизнес-логики). Pace 1 минута для быстрого реагирования.
  - name: default-1m
    interval: 1m
    rules:
      - alert: APIDown
        expr: up{job="marketpclce-api"} < 1
        for: 1m
        labels: { severity: page, team: backend }
        annotations:
          summary: "API контейнер не отвечает на /metrics"
          description: "alloy не может скрейпить marketpclce-api:8080/metrics. Контейнер упал ИЛИ alloy потерял сеть."

      - alert: DiskNearFull
        expr: |
          node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
          /
          node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
          < 0.15
        for: 1m
        labels: { severity: page, team: backend }
        annotations:
          summary: "Диск < 15% свободного"
          description: "На корневом разделе осталось мало места. Чисти Docker images/volumes/logs (см. docs/VDS_SETUP.md §1.4 Disk-бюджет)."

      - alert: OOMRisk
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 1m
        labels: { severity: page, team: backend }
        annotations:
          summary: "RAM available < 10%"
          description: "Скоро OOM-killer. Контейнеры с mem_limit могут начать падать. Проверь самых жирных через `docker stats`."

      - alert: ErrorRate5xxBurst
        # Дублирует HighErrorRate (5m), но с for=1m — для более резкой реакции.
        # Срабатывает быстрее если внезапная пиковая ошибка.
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_requests_total[5m])), 1)
          > 0.05
        for: 1m
        labels: { severity: page, team: backend }
        annotations:
          summary: "API 5xx > 5% (1m, быстрая реакция)"
          description: "Burst ошибок. См. http-dashboard → Errors by route."

      - alert: APINotScraped
        # Двойная страховка к APIDown: проверяем что метрики вообще приходят.
        # Если alloy сам упал — up{} становится stale, эта проверка пробьёт.
        expr: absent(up{job="marketpclce-api"})
        for: 2m
        labels: { severity: page, team: backend }
        annotations:
          summary: "Метрика up{marketpclce-api} отсутствует 2+ мин"
          description: "Alloy не пушит scrape-метрики. Проверь `docker compose logs alloy` и GRAFANA_CLOUD_PROM_* в .env.prod."
