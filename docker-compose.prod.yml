# Prod-стек на одной VDS (Timeweb). Запуск из корня репо:
#   make deploy        # первый раз и после git pull
#   make prod-up       # просто поднять
#   make prod-logs     # логи всех сервисов
# Все служебные сервисы только во внутренней сети compose; наружу торчит
# лишь caddy (80/443). Медиа в Yandex Object Storage по S3_*.

# Ограничиваем json-file логи docker'а: иначе /var/lib/docker/containers/*
# растут неограниченно и забивают диск VDS. 10m × 5 = до 50MB на контейнер
# до ротации. Alloy продолжает читать ротированные файлы через docker API.
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    <<: *default-logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketpclce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?postgres password is required}
      POSTGRES_DB: ${POSTGRES_DB:-marketpclce}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Проброс только на loopback VDS — наружу 5432 НЕ торчит, ни в каком
    # случае не убирай 127.0.0.1: префикс. Используется для DBeaver через
    # SSH-туннель: на машине разработчика `ssh -L 5433:localhost:5432 root@<vds>`,
    # дальше DBeaver идёт на localhost:5433.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m

  opensearch:
    <<: *default-logging
    image: opensearchproject/opensearch:2.15.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:?opensearch admin password is required}
      # Heap 2g при mem_limit 6g — правило «heap ≈ треть-половина лимита
      # контейнера». Вторая часть лимита нужна не JVM, а ядру под page cache
      # сегментов Lucene: поиск читает их mmap'ом, и если кэшу негде жить,
      # каждый запрос идёт на диск.
      #
      # 2026-08-17, ESLatencyHigh (op=search, p95 > 2s): было 512m/1g, и
      # контейнер стоял на 99% лимита (1014MiB из 1GiB) при 13 ГБ свободных
      # на хосте. Heap помещался, а page cache — уже нет, отсюда 143 МБ
      # block read и медленный search. Хост-алерт OOMRisk этого не видел:
      # он смотрит на память VDS, а упор был в cgroup контейнера.
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -Eq 'green|yellow' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
    # 6g — это потолок, а не резерв: контейнер занимает столько, сколько
    # реально нужно (heap 2g + off-heap ~1g + кэш, который ядро отдаст
    # обратно под давлением). На VDS 15 ГБ, так что запас есть.
    mem_limit: 6g

  redis:
    <<: *default-logging
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m

  api:
    <<: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
    image: marketpclce/app:latest
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8080"
    healthcheck:
      # Путь именно /healthz. Роутер отдаёт /healthz и /readyz, а /health
      # не существует — healthcheck три месяца получал 404, контейнер
      # числился unhealthy, и `up -d` спотыкался на depends_on у web:
      # «dependency failed to start: container api-api-1 is unhealthy».
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 256m

  # worker делит образ с api (см. CMD в Dockerfile = api), переопределяем
  # на ./worker. Один и тот же конфиг через .env.prod.
  worker:
    <<: *default-logging
    image: marketpclce/app:latest
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    command: ["worker"]
    # 1g — для ffmpeg-транскода 480p H.264 preview'ев (см. docs/VIDEO_TRANSCODING.md).
    # Было 128m, что мало для libx264 thread-pools'ов — cgroup-OOM убивал
    # ffmpeg до первого кадра. Базовое потребление worker'а ~150-250MB,
    # peak с ffmpeg ~500-700MB, 1g даёт запас.
    mem_limit: 1g

  # Фронт + reverse-proxy. Образ собирается из соседнего клона
  # marketplace-web (../web). На VDS оба репо живут рядом:
  #   /opt/marketpclce/api  (этот репо)
  #   /opt/marketpclce/web  (git clone marketplace-web)
  # Caddyfile внутри образа уже знает: /api/* и /swagger/* → API_UPSTREAM,
  # всё остальное — статика + SPA fallback.
  web:
    <<: *default-logging
    build:
      context: ../web
      dockerfile: Dockerfile
    image: marketpclce/web:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required, e.g. wayprmarket.ru (apex without subdomain)}
      API_UPSTREAM: api:8080
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api:
        condition: service_healthy

  # ── Observability: node-exporter + Grafana Alloy → Grafana Cloud ──
  # node-exporter раздаёт CPU/RAM/диск/сеть VDS как Prometheus-метрики.
  # Порт наружу не торчит — только внутри docker network, alloy скрейпит
  # его как node-exporter:9100.
  node-exporter:
    <<: *default-logging
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    mem_limit: 64m

  # Grafana Alloy — единый агент: метрики (api + node) и логи (docker)
  # пушит в Grafana Cloud. Креды берутся из .env.prod (GRAFANA_CLOUD_*).
  # Если креды пустые — контейнер запустится, но скрейп будет фейлиться;
  # это видно в `docker compose logs alloy`. Чтобы выключить полностью —
  # просто не запускай этот сервис: `--scale alloy=0`.
  alloy:
    <<: *default-logging
    image: grafana/alloy:v1.4.2
    restart: unless-stopped
    # Явный DNS: обходим хостовый resolver, который иногда отдаёт SERVFAIL
    # на grafana.net (наблюдалось 2026-06-24 — `server misbehaving` от
    # 127.0.0.11 в логах alloy, метрики не уезжали в Grafana Cloud).
    # 1.1.1.1 Cloudflare + 8.8.8.8 Google как fallback.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
      # Для cAdvisor-экспортера нужен только /sys — статистика берётся из
      # cgroup. Моунты /rootfs, /var/lib/docker и /dev/disk были убраны:
      # docker-обработчик cAdvisor на этом драйвере (overlayfs) всё равно не
      # работает, зато они давали root-доступ ко всей файловой системе хоста.
      - /sys:/sys:ro
    environment:
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:-}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:-}
      GRAFANA_CLOUD_PROM_KEY: ${GRAFANA_CLOUD_PROM_KEY:-}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_LOKI_KEY: ${GRAFANA_CLOUD_LOKI_KEY:-}
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      api:
        condition: service_started
      node-exporter:
        condition: service_started
    mem_limit: 256m

volumes:
  pgdata:
  osdata:
  caddydata:
  caddyconfig:
  alloy-data:
